[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-cert"
version = "0.1.0"
description = "Gaia Conscious Certification Management System"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-Login==0.6.3",
    "psycopg[binary]==3.2.10",
    "python-dotenv==1.2.4"
]

[tool.setuptools]
py-modules = ["app"]