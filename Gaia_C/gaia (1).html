<!DOCTYPE html>

    <style>

            font-size: 35px;

<body>

<header>
    <div class="navbar">
        <a class="brand" href="index.html">
            <img src="assets/emblem.png" alt="Gaia Conscious emblem">
            <span>
                Gaia Conscious
                <small>Healthy people. Healthy planet.</small>
            </span>
        </a>

        <a class="top-link" href="login.html">
            Already have an account? <strong>Log in</strong>
        </a>
    </div>
</header>

<main class="page">

    <div class="progress">
        <span>Account setup</span>
       <div></div>
        <span>Step 1 </span>
    </div>

    <div class="layout">

        <section class="form-card">

            <div class="eyebrow">The basics first</div>

            <h1>Enter your details</h1>

            <p class="intro">
                Your organisation's details help us personalise your account
                and certification recommendations. Add a website if you
                have one .
            </p>

            <form id="signupForm">

                <h2 class="section-title">Your organisation</h2>

                <div class="fields">

                    <div class="field full">
                        <label for="orgName">
                            Your organisation's name <span class="required">*</span>
                        </label>
                        <input id="orgName" name="orgName"
                               placeholder="e.g. Green Leaf Wellness"
                               autocomplete="organization" required>
                    </div>

                    <div class="field full">
                        <label for="email">
                            Your business email <span class="required">*</span>
                        </label>
                        <input id="email" name="email" type="email"
                               placeholder="you@yourorganisation.com"
                               autocomplete="email" required>
                    </div>

                    <div class="field full">
                        <label for="website">Your website URL</label>
                        <div class="url-wrap">
                            <span class="url-prefix">https://</span>
                            <input id="website" name="website" type="text"
                                   placeholder="www.yourorganisation.com">
                        </div>
                        <span class="hint">Optional - you can add this later.</span>
                    </div>

                    <div class="field">
                        <label for="country">
                            The country you are in
                            <span class="required">*</span>
                        </label>
                        <select id="country" name="country" required>
                            <option value="">Choose a country</option>
                            <option>South Africa</option>
                            <option>Botswana</option>
                            <option>Eswatini</option>
                            <option>Lesotho</option>
                            <option>Namibia</option>
                            <option>Zimbabwe</option>
                            <option>Mozambique</option>
                            <option>United Kingdom</option>
                            <option>United States</option>
                            <option>Other</option>
                        </select>
                    
                    </div>

                    <div class="field full">
                        <label for="city">City you are in</label>
                        <input id="city" name="city"
                               placeholder="e.g. Johannesburg, Cape Town">
                        <span class="hint">
                            Leave blank if you only operate in your country.
                        </span>
                    </div>

                    <div class="field full">
                        <label for="referral">Were you referred by someone?</label>
                        <input id="referral" name="referral"
                               placeholder="Name or organisation (optional)">
                    </div>

                </div>

                <h2 class="section-title">Your personal details details</h2>

                <div class="fields">

                    <div class="field">
                        <label for="firstName">
                            Your first name <span class="required">*</span>
                        </label>
                        <input id="firstName" name="firstName"
                               autocomplete="given-name" required>
                    </div>

                    <div class="field">
                        <label for="lastName">
                            Your last name <span class="required">*</span>
                        </label>
                        <input id="lastName" name="lastName"
                               autocomplete="family-name" required>
                    </div>
                       <div class="field">
                        <label for="phone number">
                            Your phone number <span class="required">*</span>
                        </label>
                        <input id="phone number" name="phone number"
                               autocomplete="tel" required>
                    </div>
                    <div class="field">
                        <label for="adress">
                            Your address <span class="required">*</span>
                        </label>
                        <input id="adress" name="adress"
                               autocomplete="street-address" required>
                    </div>
                    <div class="field">
                        <label for="password">
                            Create a password <span class="required">*</span>
                        </label>
                        <input id="password" name="password" type="password"
                               minlength="8" autocomplete="new-password"
                               placeholder="At least 8 characters" required>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">
                            Confirm password <span class="required">*</span>
                        </label>
                        <input id="confirmPassword" name="confirmPassword"
                               type="password" minlength="8"
                               autocomplete="new-password"
                               placeholder="Enter it again" required>
                    </div>

                </div>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    <span>
                        I agree to the applicable terms and privacy policy.
                    </span>
                </label>

                <button class="primary-button" type="submit">
                    Continue to account setup
                </button>

                <p class="status" id="status" role="status" aria-live="polite"></p>

                <p class="signin">
                    Already registered? <a href="login.html">Log in here</a>
                </p>

            </form>
        </section>

       

                </div>
            </div>
        </aside>

    </div>

</main>

<footer>
    Gaia Conscious | Science-led certification for conscious businesses
</footer>

<script>
    const orgNameInput = document.getElementById("orgName");
    const countryInput = document.getElementById("country");
   

    orgNameInput.addEventListener("input", function () {
        document.getElementById("previewOrg").textContent =
            orgNameInput.value.trim() || "No Organisation";
    });

    countryInput.addEventListener("change", function () {
        document.getElementById("previewCountry").textContent =
            countryInput.value || "Not selected";
    });


    document.getElementById("signupForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const status = document.getElementById("status");

        if (password !== confirmPassword) {
            status.textContent = "Your passwords do not match. Please try again.";
            document.getElementById("confirmPassword").focus();
            return;
        }

       parent.gaiaGo("scheme-selection");

    });
</script>

</body>

     aria-modal="true" aria-labelledby="modalTitle">

<script>

// ==========================================
// SCHEME INFORMATION
// ==========================================

const schemeDetails = {

    Salon: {
        number: "Scheme 01",
        description: "Certification for salons, beauty bars, nail businesses, lash businesses and hair businesses.",
        standard: "GC-SALON-STD-001 v1.1",
        gates: "7",
        certification: "60%",
        silver: "75%",
        gold: "85%",
        micro: "55%",
        safeguards: [
            "A Chemical Safety: 18/30",
            "B IAQ: 13/25"
        ],
        validity: "36 months",
        declaration: "Yes",
        fees: [
            "Solo: R7,500",
            "Small: R12,000",
            "Mid: R18,500",
            "Large: R28,000"
        ],
        bonus: "CR /5 (non-tier)"
    },

    Hospitality: {
        number: "Scheme 02",
        description: "Certification for hospitality businesses such as hotels, restaurants and cafes.",
        standard: "v3.1 + ANNEX v2.1",
        gates: "5",
        certification: "60%",
        silver: "75%",
        gold: "85%",
        micro: "54% (small x0.9)",
        safeguards: [
            "A Guest Wellbeing: 10/20",
            "B IAQ: 8/15",
            "H Governance: 3/5"
        ],
        validity: "36 months",
        declaration: "Yes",
        fees: [
            "Small: R12,500",
            "Mid: R23,000",
            "Large: R35,500"
        ],
        bonus: "Not applicable"
    },

    Product: {
        number: "Scheme 03",
        description: "Certification for product brands and businesses that manufacture or sell products.",
        standard: "v3.1 + ANNEX v1.1",
        gates: "5",
        certification: "65%",
        silver: "80%",
        gold: "90%",
        micro: "Risk x1.2 / 1.0 / 0.9",
        safeguards: [
            "A Chemical Safety: 18/30",
            "B Emissions: 10/20"
        ],
        validity: "36 months",
        declaration: "Yes",
        fees: [
            "According to the applicable fee schedule"
        ],
        bonus: "NP /5 (non-tier)"
    },

    Aesthetic: {
        number: "Scheme 04",
        description: "Certification for aesthetic and beauty treatment businesses.",
        standard: "GC-AEST-STD-001 v1.0",
        gates: "8",
        certification: "60%",
        silver: "75%",
        gold: "85%",
        micro: "55%",
        safeguards: [
            "A Active Ingredients: 18/30",
            "B Client Safety: 13/25"
        ],
        validity: "12 months",
        declaration: "N/A - Annual",
        fees: [
            "Solo: R7,500",
            "Small: R12,000",
            "Mid: R18,500",
            "Large: R28,000"
        ],
        bonus: "G bonus /3"
    },

    Packaging: {
        number: "Scheme 05",
        description: "Certification for packaging solutions and packaging-related businesses.",
        standard: "GC-PACK-STD-001 v1.0",
        gates: "5",
        certification: "60%",
        silver: "75%",
        gold: "85%",
        micro: "55% (micro converter)",
        safeguards: [
            "A Material & Chemical Safety: 18/30",
            "B Recyclability & Design: 13/25"
        ],
        validity: "36 months",
        declaration: "Yes",
        fees: [
            "Solo: R9,500",
            "Small: R16,000",
            "Mid: R26,000",
            "Large: R42,000"
        ],
        bonus: "G bonus /3"
    }

};


// ==========================================
// ELEMENTS
// ==========================================

const schemeCards = document.querySelectorAll(".scheme-card");
const informationPanel = document.getElementById("informationPanel");
const schemeNumber = document.getElementById("schemeNumber");
const schemeTitle = document.getElementById("schemeTitle");
const schemeDescription = document.getElementById("schemeDescription");
const schemeInformation = document.getElementById("schemeInformation");
const schemeMessage = document.getElementById("schemeMessage");
const selectSchemeButton = document.getElementById("selectSchemeButton");
const backButton = document.getElementById("backButton");

const clientModal = document.getElementById("clientModal");
const clientIDDisplay = document.getElementById("clientIDDisplay");
const copyClientID = document.getElementById("copyClientID");
const copyStatus = document.getElementById("copyStatus");
const continueDashboard = document.getElementById("continueDashboard");

let selected,Scheme = "";


// ==========================================
// DISPLAY SCHEME INFORMATION
// ==========================================

function displaySchemeInformation(details) {

    schemeInformation.innerHTML = "";

    function addSection(title, items) {

        const section = document.createElement("div");
        section.className = "info-section";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const list = document.createElement("ul");
        list.className = "info-list";

        items.forEach(function(item) {

            const li = document.createElement("li");

            if (Array.isArray(item)) {
                const strong = document.createElement("strong");
                strong.textContent = item[0] + ": ";

                li.appendChild(strong);
                li.appendChild(document.createTextNode(item[1]));
            } else {
                li.textContent = item;
            }

            list.appendChild(li);
        });

        section.appendChild(heading);
        section.appendChild(list);
        schemeInformation.appendChild(section);
    }

    addSection("Standard and Certification Requirements", [
        ["Standard version", details.standard],
        ["Number of gates", details.gates],
        ["Certification minimum", details.certification],
        ["Silver minimum", details.silver],
        ["Gold minimum", details.gold],
        ["Micro / Adjusted Certification minimum", details.micro]
    ]);

    addSection("Safeguard Requirements", details.safeguards);

    addSection("Certification Validity and Declaration", [
        ["Certificate validity", details.validity],
        ["Declaration (Year 1 / Year 2)", details.declaration]
    ]);

    addSection("Certification Fees", details.fees);

    addSection("Bonus Category", [
        ["Bonus", details.bonus]
    ]);
}


// ==========================================
// SCHEME CARD SELECTION
// ==========================================

schemeCards.forEach(function(card) {

    card.addEventListener("click", function() {

        selectedScheme = card.dataset.scheme;

        const details = schemeDetails[selectedScheme];

        schemeCards.forEach(function(item) {

            const active = item === card;

            item.classList.toggle("active", active);
            item.setAttribute("aria-pressed", String(active));

        });

        schemeNumber.textContent = details.number;
        schemeTitle.textContent = selectedScheme + " Scheme";
        schemeDescription.textContent = details.description;

        displaySchemeInformation(details);

        schemeMessage.textContent = "";
        informationPanel.hidden = false;

        informationPanel.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    });

});


// ==========================================
// BACK BUTTON
// ==========================================

backButton.addEventListener("click", function() {

    informationPanel.hidden = true;
    schemeMessage.textContent = "";
    selectedScheme = "";

    schemeCards.forEach(function(card) {
        card.classList.remove("active");
        card.setAttribute("aria-pressed", "false");
    });

});


// ==========================================
// UNIQUE CLIENT ID GENERATION
// ==========================================

function generateClientID(scheme) {

    const prefixes = {
        Salon: "SAL",
        Hospitality: "HOS",
        Product: "PRO",
        Aesthetic: "AES",
        Packaging: "PAC"
    };

    const prefix = prefixes[scheme];
    const year = new Date().getFullYear();

    const randomPart = crypto.randomUUID()
        .replace(/-/g, "")
        .substring(0, 12)
        .toUpperCase();

    return `GC-${prefix}-${year}-${randomPart}`;
}


// ==========================================
// SELECT SCHEME AND SHOW CLIENT ID
// ==========================================

selectSchemeButton.addEventListener("click", function() {

    if (!selectedScheme) {
        schemeMessage.textContent = "Please select a scheme first.";
        return;
    }

    const clientID = generateClientID(selectedScheme);

    // Save client information for the next pages

    const clientData = {
        clientID: clientID,
        selectedScheme: selectedScheme,
        createdAt: new Date().toISOString()
    };

    localStorage.setItem("gaiaClientData", JSON.stringify(clientData));

    sessionStorage.setItem("clientID", clientID);
    sessionStorage.setItem("selectedScheme", selectedScheme);

    // Display the generated ID

    clientIDDisplay.textContent = clientID;
    copyStatus.textContent = "";

    clientModal.classList.add("show");

    copyClientID.focus();

});


// ==========================================
// COPY CLIENT ID
// ==========================================

copyClientID.addEventListener("click", async function() {

    const clientID = clientIDDisplay.textContent;

    try {

        await navigator.clipboard.writeText(clientID);

        copyStatus.textContent = "Client ID copied successfully.";

        copyClientID.textContent = "Copied";

    } catch (error) {

        // Fallback for browsers without clipboard access

        const temp = document.createElement("textarea");
        temp.value = clientID;

        document.body.appendChild(temp);
        temp.select();

        const copied = document.execCommand("copy");

        temp.remove();

        copyStatus.textContent = copied
            ? "Client ID copied successfully."
            : "Please select and copy your Client ID manually.";

    }

});


// ==========================================
// CONTINUE TO DASHBOARD
// ==========================================

continueDashboard.addEventListener("click", function() {

    parent.gaiaGo("dashboard");

});

</script>

</body>

</script>

<script>

/* RETRIEVE REGISTERED INFORMATION */

function getStoredValue(key) {

    return sessionStorage.getItem(key)
        || localStorage.getItem(key)
        || "";

}


letsavedClientData = {};

try {

    savedClientData = JSON.parse(
        localStorage.getItem("gaiaClientData") || "{}"
    );

} catch (error) {

    savedClientData = {};

}


firstName = getStoredValue("firstName");

lastName = getStoredValue("lastName");

 businessName =
    getStoredValue("business")
    || savedClientData.business
    || "";

fullName =
    [firstName, lastName].filter(Boolean).join(" ").trim();

displayName =
    fullName || businessName || "Client";


/* CLIENT ID */

 clientID =
    getStoredValue("clientID")
    || savedClientData.clientID
    || "";


/* SELECTED SCHEME */

 selectedScheme =
    getStoredValue("selectedScheme")
    || savedClientData.selectedScheme
    || "";


/* DISPLAY USER INFORMATION */

document.getElementById("welcomeName").textContent =
    "Welcome, " + displayName;

document.getElementById("headerUserName").textContent =
    displayName;

document.getElementById("userInitial").textContent =
    displayName.charAt(0).toUpperCase();


/* DISPLAY CLIENT ID */

document.getElementById("dashboardClientID").textContent =
    clientID || "Client ID unavailable";

document.getElementById("organisationClientID").textContent =
    clientID || "Not available";


/* DISPLAY SCHEME */

document.getElementById("schemeName").textContent =
    selectedScheme || "Scheme not selected";

document.getElementById("organisationScheme").textContent =
    selectedScheme || "Not selected";


/* ORGANISATION DETAILS */

document.getElementById("organisationName").textContent =
    businessName || "Not provided";

document.getElementById("contactName").textContent =
    fullName || "Not provided";


/* COPY CLIENT ID */

document.getElementById("dashboardCopyButton")
.addEventListener("click", async function() {

    const message =
        document.getElementById("copyMessage");

    if (!clientID) {

        message.textContent =
            "No Client ID is available to copy.";

        return;

    }

    try {

        await navigator.clipboard.writeText(clientID);

        message.textContent =
            "Client ID copied successfully.";

        this.textContent = "Copied";

    } catch (error) {

        const field = document.createElement("textarea");

        field.value = clientID;

        document.body.appendChild(field);

        field.select();

        const copied = document.execCommand("copy");

        field.remove();

        message.textContent = copied
            ? "Client ID copied successfully."
            : "Please copy your Client ID manually.";

        if (copied) {
            this.textContent = "Copied";
        }

    }

});


/* LOG OUT */

document.getElementById("logoutButton")
.addEventListener("click", function() {

    if (confirm("Are you sure you want to log out?")) {

        sessionStorage.clear();

        parent.gaiaGo("login");

    }

});


/* SIDEBAR ACTIVE MENU */

document.querySelectorAll(".sidebar-menu a")
.forEach(function(link) {

    link.addEventListener("click", function() {

        document.querySelectorAll(".sidebar-menu a")
        .forEach(item => item.classList.remove("active"));

        this.classList.add("active");

    });

});

</script>

<script>

/* REGISTERED CLIENT INFORMATION */

function getStoredValue(key) {
    return sessionStorage.getItem(key)
        || localStorage.getItem(key)
        || "";
}

let savedClientData = {};

try {
    savedClientData = JSON.parse(
        localStorage.getItem("gaiaClientData") || "{}"
    );
} catch (error) {
    savedClientData = {};
}

const firstName = getStoredValue("firstName");
const lastName = getStoredValue("lastName");

const fullName = [firstName, lastName]
    .filter(Boolean).join(" ").trim();

const businessName =
    getStoredValue("business")
    || savedClientData.business
    || "";

const clientID =
    getStoredValue("clientID")
    || savedClientData.clientID
    || "";

const selectedScheme =
    getStoredValue("selectedScheme")
    || savedClientData.selectedScheme
    || "";

const displayName = fullName || businessName || "Client";


/* DISPLAY REGISTERED DETAILS */

document.getElementById("headerUserName").textContent = displayName;

document.getElementById("userInitial").textContent =
    displayName.charAt(0).toUpperCase();

document.getElementById("clientID").textContent =
    clientID || "Not available";

document.getElementById("businessName").textContent =
    businessName || "Not provided";

document.getElementById("contactName").textContent =
    fullName || "Not provided";

document.getElementById("schemeName").textContent =
    selectedScheme || "Scheme not selected";


/* APPLICATION INFORMATION */

document.getElementById("applicationReference").textContent =
    getStoredValue("applicationReference")
    || savedClientData.applicationReference
    || "To be assigned";

document.getElementById("applicationDate").textContent =
    getStoredValue("applicationDate")
    || savedClientData.applicationDate
    || "To be populated";


/* NINE STAGE WORKFLOW */

const stages = [
    "Enquiry & Proposal",
    "Application & Agreement",
    "Pre-Assessment",
    "Assessment",
    "Reporting",
    "Certification Decision",
    "Certificate Issuance",
    "Surveillance & Renewal",
    "Closed"
];

const currentStageNumber = Number(
    getStoredValue("currentStageNumber")
    || savedClientData.currentStageNumber
    || 3
);

const validStage = Math.min(
    9,
    Math.max(1, currentStageNumber)
);

const stageGrid = document.getElementById("stageGrid");

stageGrid.innerHTML = "";

stages.forEach(function(stage, index) {

    const number = index + 1;

    let status = "Upcoming";
    let className = "stage-card";

    if (number < validStage) {
        status = "Completed";
        className += " completed";
    }

    if (number === validStage) {
        status = "In Progress";
        className += " current";
    }

    if (validStage === 9 && number === 9) {
        status = "Current";
    }

    const card = document.createElement("div");
    card.className = className;

    card.innerHTML = `
        <div class="stage-number">${number}</div>
        <div class="stage-name"></div>
        <div class="stage-status">${status}</div>
    `;

    card.querySelector(".stage-name").textContent = stage;

    stageGrid.appendChild(card);

});

const progress = Math.round((validStage / 9) * 100);

document.getElementById("progressFill").style.width =
    progress + "%";

document.getElementById("progressPercent").textContent =
    progress + "%";

document.getElementById("progressLabel").textContent =
    validStage === 9
    ? "Application workflow closed"
    : stages[validStage - 1];


/* CURRENT STAGE DETAILS */

document.getElementById("currentStage").textContent =
    "CURRENT STAGE: " + stages[validStage - 1].toUpperCase();

document.getElementById("stageDetail").textContent =
    stages[validStage - 1];

document.getElementById("nextAction").textContent =
    getStoredValue("nextAction")
    || savedClientData.nextAction
    || (validStage === 3
        ? "Awaiting document requirements"
        : "Awaiting application update");

document.getElementById("submissionDeadline").textContent =
    getStoredValue("submissionDeadline")
    || savedClientData.submissionDeadline
    || "To be assigned";

document.getElementById("applicationStatus").textContent =
    validStage === 9 ? "Closed" : "In Progress";


/* PAYMENT INFORMATION */

const paymentFields = [
    ["quotationAmount", "quotationAmount", "Not yet issued"],
    ["depositAmount", "depositAmount", "Awaiting quotation"],
    ["balanceAmount", "balanceAmount", "Not yet calculated"],
    ["paymentStatus", "paymentStatus", "Awaiting quotation"]
];

paymentFields.forEach(function(field) {

    const stored =
        getStoredValue(field[1])
        || savedClientData[field[1]]
        || "";

    document.getElementById(field[0]).textContent =
        stored || field[2];

});


/* LOG OUT */

document.getElementById("logoutButton")
.addEventListener("click", function() {

    if (confirm("Are you sure you want to log out?")) {
        sessionStorage.clear();
        parent.gaiaGo("login");
    }

});

</script>

</body>
</html>

</script>

<script>
var flow = ["signup","scheme-selection","dashboard","application","login"];
var pages = {};
flow.forEach(function(n){
    var el = document.getElementById("page-" + n);
    if (el) pages[n] = el.textContent.split("<\\/script").join("<" + "/script");
});
var frame = document.getElementById("view");
var current = null;

function gaiaGo(name){
    if (!pages[name]) return;
    if (location.hash !== "#" + name) {
        location.hash = name;
        return;
    }
    show(name);
}
window.gaiaGo = gaiaGo;

function show(name){
    if (current === name) return;
    current = name;
    frame.srcdoc = pages[name];
}

frame.addEventListener("load", function(){
    var doc = frame.contentDocument;
    if (!doc) return;
    document.title = doc.title || "Gaia Conscious";
    doc.querySelectorAll("form[action^='http']").forEach(function(f){ f.target = "_blank"; });
    doc.addEventListener("click", function(e){
        var a = e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        var href = a.getAttribute("href");
        if (href.charAt(0) === "#") {
            e.preventDefault();
            var t = doc.getElementById(href.slice(1));
            if (t) t.scrollIntoView();
            return;
        }
        var m = href.match(/^([a-z-]+)\.html$/);
        if (m) {
            e.preventDefault();
            gaiaGo(m[1]);
        }
    });
});

function route(){
    var name = location.hash.slice(1);
    if (!pages[name]) name = flow[0];
    current = null;
    show(name);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
