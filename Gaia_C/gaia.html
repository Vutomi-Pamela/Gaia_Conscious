\n\n                \u003cdiv class=\"status-row\">\n                    \u003cspan>Assigned Assessor\u003c/span>\n                    \u003cspan>Not assigned\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"status-row\">\n                    \u003cspan>Assessment Progress\u003c/span>\n                    \u003cspan class=\"status pending\">Upcoming\u003c/span>\n                \u003c/div>\n\n            \u003c/section>\n\n        \u003c/div>\n\n\n        \u003c!-- REPORTS AND CORRECTIVE ACTIONS -->\n\n        \u003cdiv class=\"two-column\">\n\n            \u003csection class=\"panel\">\n\n                \u003ch2>Reports\u003c/h2>\n\n                \u003cp class=\"panel-description\">\n                    Completed assessment reports and official application\n                    reports will be made available here.\n                \u003c/p>\n\n                \u003cdiv class=\"notice\">\n                    No reports are currently available.\n                    Reports will appear here once they have been\n                    completed and released.\n                \u003c/div>\n\n            \u003c/section>\n\n\n            \u003csection class=\"panel\">\n\n                \u003ch2>Corrective Actions\u003c/h2>\n\n                \u003cp class=\"panel-description\">\n                    Monitor any non-conformances identified during assessment.\n                \u003c/p>\n\n                \u003cdiv class=\"status-row\">\n                    \u003cspan>Major NCR\u003c/span>\n                    \u003cspan>30-day deadline\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"status-row\">\n                    \u003cspan>Minor NCR\u003c/span>\n                    \u003cspan>60-day deadline\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"status-row\">\n                    \u003cspan>Immediate Action\u003c/span>\n                    \u003cspan>As instructed\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"notice\" style=\"margin-top:13px\">\n                    No corrective actions have been recorded.\n                \u003c/div>\n\n            \u003c/section>\n\n        \u003c/div>\n\n\n        \u003c!-- DECISION AND CERTIFICATE -->\n\n        \u003cdiv class=\"section-heading\">Certification Outcome\u003c/div>\n\n        \u003csection class=\"panel\">\n\n            \u003cdiv class=\"two-column\">\n\n                \u003cdiv>\n                    \u003ch2>Certification Decision\u003c/h2>\n\n                    \u003cp class=\"panel-description\">\n                        The formal Certification Decision Panel (CDP)\n                        outcome will be recorded after the assessment\n                        and applicable review processes.\n                    \u003c/p>\n\n                    \u003cdiv class=\"status pending\" id=\"decisionStatus\">\n                        Decision Pending\n                    \u003c/div>\n\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003ch2>Certificate Information\u003c/h2>\n\n                    \u003cp class=\"panel-description\">\n                        If certification is awarded, certificate details\n                        and verification information will be available here.\n                    \u003c/p>\n\n                    \u003cdiv class=\"status pending\" id=\"certificateStatus\">\n                        Not Issued\n                    \u003c/div>\n\n                \u003c/div>\n\n            \u003c/div>\n\n            \u003cdiv class=\"info-grid\" style=\"margin-top:22px\">\n\n                \u003cdiv class=\"info-box\">\n                    \u003cstrong>Certificate Number\u003c/strong>\n                    \u003cspan id=\"certificateNumber\">Not issued\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"info-box\">\n                    \u003cstrong>Validity Period\u003c/strong>\n                    \u003cspan id=\"certificateValidity\">Not available\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"info-box\">\n                    \u003cstrong>QR Verification\u003c/strong>\n                    \u003cspan id=\"certificateQR\">Not available\u003c/span>\n                \u003c/div>\n\n            \u003c/div>\n\n        \u003c/section>\n\n    \u003c/section>\n\n\n    \u003cfooter class=\"page-footer\">\n        Gaia Conscious | Independent Certification Portal\n    \u003c/footer>\n\n\u003c/main>\n\u003c/div>\n\n\n\u003cscript>\n\n/* REGISTERED CLIENT INFORMATION */\n\nfunction getStoredValue(key) {\n    return sessionStorage.getItem(key)\n        || localStorage.getItem(key)\n        || \"\";\n}\n\nlet savedClientData = {};\n\ntry {\n    savedClientData = JSON.parse(\n        localStorage.getItem(\"gaiaClientData\") || \"{}\"\n    );\n} catch (error) {\n    savedClientData = {};\n}\n\nconst firstName = getStoredValue(\"firstName\");\nconst lastName = getStoredValue(\"lastName\");\n\nconst fullName = [firstName, lastName]\n    .filter(Boolean).join(\" \").trim();\n\nconst businessName =\n    getStoredValue(\"business\")\n    || savedClientData.business\n    || \"\";\n\nconst clientID =\n    getStoredValue(\"clientID\")\n    || savedClientData.clientID\n    || \"\";\n\nconst selectedScheme =\n    getStoredValue(\"selectedScheme\")\n    || savedClientData.selectedScheme\n    || \"\";\n\nconst displayName = fullName || businessName || \"Client\";\n\n\n/* DISPLAY REGISTERED DETAILS */\n\ndocument.getElementById(\"headerUserName\").textContent = displayName;\n\ndocument.getElementById(\"userInitial\").textContent =\n    displayName.charAt(0).toUpperCase();\n\ndocument.getElementById(\"clientID\").textContent =\n    clientID || \"Not available\";\n\ndocument.getElementById(\"businessName\").textContent =\n    businessName || \"Not provided\";\n\ndocument.getElementById(\"contactName\").textContent =\n    fullName || \"Not provided\";\n\ndocument.getElementById(\"schemeName\").textContent =\n    selectedScheme || \"Scheme not selected\";\n\n\n/* APPLICATION INFORMATION */\n\ndocument.getElementById(\"applicationReference\").textContent =\n    getStoredValue(\"applicationReference\")\n    || savedClientData.applicationReference\n    || \"To be assigned\";\n\ndocument.getElementById(\"applicationDate\").textContent =\n    getStoredValue(\"applicationDate\")\n    || savedClientData.applicationDate\n    || \"To be populated\";\n\n\n/* NINE STAGE WORKFLOW */\n\nconst stages = [\n    \"Enquiry & Proposal\",\n    \"Application & Agreement\",\n    \"Pre-Assessment\",\n    \"Assessment\",\n    \"Reporting\",\n    \"Certification Decision\",\n    \"Certificate Issuance\",\n    \"Surveillance & Renewal\",\n    \"Closed\"\n];\n\nconst currentStageNumber = Number(\n    getStoredValue(\"currentStageNumber\")\n    || savedClientData.currentStageNumber\n    || 3\n);\n\nconst validStage = Math.min(\n    9,\n    Math.max(1, currentStageNumber)\n);\n\nconst stageGrid = document.getElementById(\"stageGrid\");\n\nstageGrid.innerHTML = \"\";\n\nstages.forEach(function(stage, index) {\n\n    const number = index + 1;\n\n    let status = \"Upcoming\";\n    let className = \"stage-card\";\n\n    if (number \u003c validStage) {\n        status = \"Completed\";\n        className += \" completed\";\n    }\n\n    if (number === validStage) {\n        status = \"In Progress\";\n        className += \" current\";\n    }\n\n    if (validStage === 9 && number === 9) {\n        status = \"Current\";\n    }\n\n    const card = document.createElement(\"div\");\n    card.className = className;\n\n    card.innerHTML = `\n        \u003cdiv class=\"stage-number\">${number}\u003c/div>\n        \u003cdiv class=\"stage-name\">\u003c/div>\n        \u003cdiv class=\"stage-status\">${status}\u003c/div>\n    `;\n\n    card.querySelector(\".stage-name\").textContent = stage;\n\n    stageGrid.appendChild(card);\n\n});\n\nconst progress = Math.round((validStage / 9) * 100);\n\ndocument.getElementById(\"progressFill\").style.width =\n    progress + \"%\";\n\ndocument.getElementById(\"progressPercent\").textContent =\n    progress + \"%\";\n\ndocument.getElementById(\"progressLabel\").textContent =\n    validStage === 9\n    ? \"Application workflow closed\"\n    : stages[validStage - 1];\n\n\n/* CURRENT STAGE DETAILS */\n\ndocument.getElementById(\"currentStage\").textContent =\n    \"CURRENT STAGE: \" + stages[validStage - 1].toUpperCase();\n\ndocument.getElementById(\"stageDetail\").textContent =\n    stages[validStage - 1];\n\ndocument.getElementById(\"nextAction\").textContent =\n    getStoredValue(\"nextAction\")\n    || savedClientData.nextAction\n    || (validStage === 3\n        ? \"Awaiting document requirements\"\n        : \"Awaiting application update\");\n\ndocument.getElementById(\"submissionDeadline\").textContent =\n    getStoredValue(\"submissionDeadline\")\n    || savedClientData.submissionDeadline\n    || \"To be assigned\";\n\ndocument.getElementById(\"applicationStatus\").textContent =\n    validStage === 9 ? \"Closed\" : \"In Progress\";\n\n\n/* PAYMENT INFORMATION */\n\nconst paymentFields = [\n    [\"quotationAmount\", \"quotationAmount\", \"Not yet issued\"],\n    [\"depositAmount\", \"depositAmount\", \"Awaiting quotation\"],\n    [\"balanceAmount\", \"balanceAmount\", \"Not yet calculated\"],\n    [\"paymentStatus\", \"paymentStatus\", \"Awaiting quotation\"]\n];\n\npaymentFields.forEach(function(field) {\n\n    const stored =\n        getStoredValue(field[1])\n        || savedClientData[field[1]]\n        || \"\";\n\n    document.getElementById(field[0]).textContent =\n        stored || field[2];\n\n});\n\n\n/* LOG OUT */\n\ndocument.getElementById(\"logoutButton\")\n.addEventListener(\"click\", function() {\n\n    if (confirm(\"Are you sure you want to log out?\")) {\n        sessionStorage.clear();\n        parent.gaiaGo(\"login\");\n    }\n\n});\n\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n",

d(\"loginForm\").addEventListener(\n        \"submit\",\n        function (event) {\n            event.preventDefault();\n\n            document.getElementById(\"status\").textContent =\n                \"The form is ready, but login authentication still needs to be connected.\";\n        }\n    );\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n\n",

var flow = ["signup","scheme-selection","dashboard","application","login"];
var frame = document.getElementById("view");
var current = null;

function gaiaGo(name){
    if (!pages[name]) return;
    if (location.hash !== "#" + name) {
        location.hash = name;
        return;
    }
    show(name);
}
window.gaiaGo = gaiaGo;

function show(name){
    if (current === name) return;
    current = name;
    frame.srcdoc = pages[name];
}

frame.addEventListener("load", function(){
    var doc = frame.contentDocument;
    if (!doc) return;
    document.title = doc.title || "Gaia Conscious";
    doc.querySelectorAll("form[action^='http']").forEach(function(f){ f.target = "_blank"; });
    doc.addEventListener("click", function(e){
        var a = e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        var href = a.getAttribute("href");
        if (href.charAt(0) === "#") {
            e.preventDefault();
            var t = doc.getElementById(href.slice(1));
            if (t) t.scrollIntoView();
            return;
        }
        var m = href.match(/^([a-z-]+)\.html$/);
        if (m) {
            e.preventDefault();
            gaiaGo(m[1]);
        }
    });
});

function route(){
    var name = location.hash.slice(1);
    if (!pages[name]) name = flow[0];
    current = null;
    show(name);
}
window.addEventListener("hashchange", route);
route();
</script>
