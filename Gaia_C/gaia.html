rganisation's name \u003cspan class=\"required\">*\u003c/span>\n                        \u003c/label>\n                        \u003cinput id=\"orgName\" name=\"orgName\"\n                               placeholder=\"e.g. Green Leaf Wellness\"\n                               autocomplete=\"organization\" required>\n                    \u003c/div>\n\n                    \u003cdiv class=\"field full\">\n                        \u003clabel for=\"email\">\n                            Your business email \u003cspan class=\"required\">*\u003c/span>\n                        \u003c/label>\n                        \u003cinput id=\"email\" name=\"email\" type=\"email\"\n                               placeholder=\"you@yourorganisation.com\"\n                               autocomplete=\"email\" required>\n                    \u003c/div>\n\n                    \u003cdiv class=\"field full\">\n                        \u003clabel for=\"website\">Your website URL\u003c/label>\n                        \u003cdiv class=\"url-wrap\">\n                            \u003cspan class=\"url-prefix\">https://\u003c/span>\n                            \u003cinput id=\"website\" name=\"website\" type=\"text\"\n                                   placeholder=\"www.yourorganisation.com\">\n                        \u003c/div>\n                        \u003cspan class=\"hint\">Optional — you can add this later.\u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv class=\"field\">\n                        \u003clabel for=\"country\">\n                            The country you are in\n                            \u003cspan class=\"required\">*\u003c/span>\n                        \u003c/label>\n                        \u003cselect id=\"country\" name=\"country\" required>\n                            \u003coption value=\"\">Choose a country\u003c/option>\n                            \u003coption>South Africa\u003c/option>\n                            \u003coption>Botswana\u bel>\n                        \u003cinput id=\"confirmPassword\" name=\"confirmPassword\"\n                               type=\"password\" minlength=\"8\"\n                               autocomplete=\"new-password\"\n                               placeholder=\"Enter it again\" required>\n                    \u003c/div>\n\n                \u003c/div>\n\n                \u003clabel class=\"terms\">\n                    \u003cinput type=\"checkbox\" name=\"terms\" required>\n                    \u003cspan>\n                        I agree to the applicable terms and privacy policy.\n                    \u003c/span>\n                \u003c/label>\n\n                \u003cbutton class=\"primary-button\" type=\"submit\">\n                    Continue to account setup\n                \u003c/button>\n\n                \u003cp class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n\n                \u003cp class=\"signin\">\n                    Already registered? \u003ca href=\"login.html\">Log in here\u003c/a>\n                \u003c/p>\n\n            \u003c/form>\n        \u003c/section>\n\n       \n\n                \u003c/div>\n            \u003c/div>\n        \u003c/aside>\n\n    \u003c/div>\n\n\u003c/main>\n\n\u003cfooter>\n    Gaia Conscious · Science-led certification for conscious businesses\n\u003c/footer>\n\n\u003cscript>\n    const orgNameInput = document.getElementById(\"orgName\");\n    const countryInput = document.getElementById(\"country\");\n   \n\n    orgNameInput.addEventListener(\"input\", function () {\n        document.getElementById(\"previewOrg\").textContent =\n            orgNameInput.value.trim() || \"No Organisation\";\n    });\n\n    countryInput.addEventListener(\"change\", function () {\n        document.getElementById(\"previewCountry\").textContent =\n            countryInput.value || \"Not selected\";\n    });\n\n\n    document.getElementById(\"signupForm\").addEventListener(\"submit\", function (event) {\n     "scheme-selection": "\n\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#17392d\">\n\u003ctitle>Gaia Conscious | Scheme Selection\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"assets/styles.css\">\n\n\u003cstyle>\n:root {\n    --green: #17392d;\n    --green-light: #285542;\n    --sage: #eaf0e7;\n    --line: #dce3da;\n    --muted: #687168;\n    --white: #ffffff;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n    margin: 0;\n    background: var(--white);\n    color: var(--green);\n    font-family: Arial, Helvetica, sans-serif;\n}\n\n.page {\n    width: 100%;\n    min-height: 100vh;\n    padding: 28px 6%;\n}\n\n.topbar {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 20px;\n    margin-bottom: 45px;\n}\n\n.brand {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n}\n\n.brand img {\n    width: 75px;\n    height:75px;\n    object-fit: contain;\n    object-position: center;\n    flex-shrink: 0;\n}\n\n.brand-name {\n    font-size: 17px;\n    font-weight: 700;\n    letter-spacing: 1.5px;\n}\n\n.brand-subtitle {\n    margin-top: 4px;\n    color: var(--muted);\n    font-size: 10px;\n    letter-spacing: 1.5px;\n}\n\n.step-label {\n    color: var(--muted);\n    font-size: 13px;\n}\n\n.content {\n    width: 100%;\n    max-width: 1000px;\n    margin: 0 auto;\n}\n\n.intro { margin-bottom: 32px; }\n\n.eyebrow {\n    margin-bottom: 12px;\n    color: var(--green-light);\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 2px;\n    text-transform: uppercase;\n}\n\nh1 {\n    margin: 0 0 14px;\n    font-size: clamp(32px, 5vw, 46px);\n    font-weight: 500;\n    letter-spacing: -1.5px;\n}\n\n.intro p {\n    max-width: 650px;\n    margin: 0;\n    color: var(--muted);\n    font-size: 15px;\n    line-height: 1.8;\n}\n\n.section-heading {\n    margin: 0 0 16px;\n    font-size: 17px;\n    font-weight: 600;\n}\n\n.scheme-grid {\n    display: grid;\n    grid-template-columns: repeat(5, minmax(0, 1fr));\n    gap: 12px;\n}\n\n.scheme-card {\n    min-height: 112px;\n    padding: 18px 12px;\n    border: 1px solid var(--line);\n    border-radius: 12px;\n    background: var(--white);\n    color: var(--green);\n    cursor: pointer;\n    text-align: left;\n    transition: border-color .2s, background .2s, transform .2s;\n}\n\n.scheme-card:hover {\n    border-color: var(--green-light);\n    transform: translateY(-2px);\n}\n\n.scheme-card.active {\n    border: 2px solid var(--green);\n    background: var(--sage);\n}\n\n.scheme-card .check {\n    display: block;\n    margin-bottom: 17px;\n    color: var(--green-light);\n    font-size: 15px;\n    font-weight: 700;\n}\n\n.scheme-card .scheme-name {\n    font-size: 14px;\n    font-weight: 700;\n}\n\n.selection-help {\n    margin: 14px 0 30px;\n    color: var(--muted);\n    font-size: 12px;\n}\n\n.information-panel {\n    padding: 25px;\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    background: var(--white);\n}\n\n.information-panel h2 {\n    margin: 0 0 9px;\n    font-size: 21px;\n    font-weight: 600;\n}\n\n.information-panel > p {\n    margin: 0 0 22px;\n    color: var(--muted);\n    font-size: 13px;\n    line-height: 1.7;\n}\n\n.scheme-number {\n    margin-bottom: 8px;\n    color: var(--green-light);\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 1.5px;\n    text-transform: uppercase;\n}\n\n.info-section { margin-top: 22px; }\n\n.info-section h3 {\n    margin: 0 0 12px;\n    padding-bottom: 9px;\n    border-bottom: 1px solid var(--line);\n    font-size: 14px;\n    font-weight: 700;\n}\n\n.info-list {\n    margin: 0;\n    padding-left: 21px;\n    color: #333;\n    font-size: 13px;\n    line-height: 1.9;\n}\n\n.info-list li { padding-left: 4px; margin-bottom: 5px; }\n.info-list strong { color: var(--green); }\n\n.actions {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 15px;\n    margin-top: 28px;\n}\n\n.button {\n    display: inline-flex;\n    min-height: 47px;\n    align-items: center;\n    justify-content: center;\n    padding: 13px 22px;\n    border: 1px solid var(--green);\n    border-radius: 7px;\n    font-size: 13px;\n    font-weight: 700;\n    cursor: pointer;\n}\n\n.button-back {\n    background: transparent;\n    color: var(--green);\n}\n\n.button-next {\n    background: var(--green);\n    color: var(--white);\n}\n\n.button-next:hover { background: var(--green-light); }\n\n.button:focus-visible,\n.scheme-card:focus-visible {\n    outline: 2px solid var(--green-light);\n    outline-offset: 3px;\n}\n\n.message {\n    margin-top: 14px;\n    color: #a33b30;\n    font-size: 13px;\n}\n\n/* CLIENT ID CONFIRMATION POPUP */\n\n.modal-overlay {\n    position: fixed;\n    inset: 0;\n    z-index: 1000;\n    display: none;\n    align-items: center;\n    justify-content: center;\n    padding: 20px;\n    background: rgba(15, 35, 27, .65);\n}\n\n.modal-overlay.show { display: flex; }\n\n.modal {\n    width: 100%;\n    max-width: 470px;\n    padding: 35px;\n    border-radius: 14px;\n    background: var(--white);\n    text-align: center;\n    box-shadow: 0 20px 60px rgba(0,0,0,.15);\n}\n\n.modal-mark {\n    width: 48px;\n    height: 48px;\n    margin: 0 auto 20px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-radius: 50%;\n    background: var(--sage);\n    color: var(--green);\n    font-size: 23px;\n}\n\n.modal h2 {\n    margin: 0 0 10px;\n    font-size: 23px;\n    font-weight: 600;\n}\n\n.modal-description {\n    color: var(--muted);\n    font-size: 13px;\n    line-height: 1.7;\n}\n\n.client-id-label {\n    display: block;\n    margin: 25px 0 9px;\n    color: var(--muted);\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 1.5px;\n    text-transform: uppercase;\n}\n\n.client-id-display {\n    padding: 17px 12px;\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    background: #f8faf7;\n    color: var(--green);\n    font-size: 17px;\n    font-weight: 700;\n    letter-spacing: 1px;\n    overflow-wrap: anywhere;\n}\n\n.copy-button {\n    width: 100%;\n    margin-top: 12px;\n    padding: 12px;\n    border: 1px solid var(--green);\n    border-radius: 7px;\n    background: var(--white);\n    color: var(--green);\n    font-size: 13px;\n    font-weight: 700;\n    cursor: pointer;\n}\n\n.copy-button:hover {\n    background: var(--sage);\n}\n\n.continue-button {\n    width: 100%;\n    margin-top: 22px;\n    padding: 15px;\n    border: none;\n    border-radius: 7px;\n    background: var(--green);\n    color: var(--white);\n    font-size: 13px;\n    font-weight: 700;\n    cursor: pointer;\n}\n\n.continue-button:hover { background: var(--green-light); }\n\n.copy-status {\n    min-height: 18px;\n    margin-top: 8px;\n    color: var(--green-light);\n    font-size: 12px;\n}\n\n@media (max-width: 760px) {\n    .scheme-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n    .scheme-card:last-child { grid-column: 1 / -1; }\n    .page { padding: 22px 5%; }\n    .topbar { margin-bottom: 35px; }\n}\n\n@media (max-width: 420px) {\n    .brand-name { font-size: 14px; }\n    .step-label { font-size: 11px; }\n    .information-panel { padding: 18px; }\n    .actions { align-items: stretch; }\n    .button { padding: 12px; }\n    .modal { padding: 25px 20px; }\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n\u003cmain class=\"page\">\n\n\u003cheader class=\"topbar\">\n    \u003cdiv class=\"brand\">\n        \u003cimg src=\"assets/emblem.png\" alt=\"Gaia Conscious logo\">\n        \u003cdiv>\n            \u003cdiv class=\"brand-name\">GAIA CONSCIOUS\u003c/div>\n            \u003cdiv class=\"brand-subtitle\">INDEPENDENT CERTIFICATION\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"progress-line\">\u003cspan>\u003c/span>\u003c/div>\n    \u003cdiv class=\"step-label\">· Step 2\u003c/div>\n\u003c/header>\n\n\u003csection class=\"content\">\n\n    \u003cdiv class=\"intro\">\n        \u003cdiv class=\"eyebrow\">Your certification journey\u003c/div>\n        \u003ch1>Scheme Selection\u003c/h1>\n        \u003cp>\n            Select the certification scheme that best matches your\n            business. Review the requirements and applicable fees\n            before proceeding.\n        \u003c/p>\n    \u003c/div>\n\n    \u003ch2 class=\"section-heading\">Select a certification scheme\u003c/h2>\n\n    \u003cdiv class=\"scheme-grid\" role=\"group\" aria-label=\"Certification scheme options\">\n\n        \u003cbutton type=\"button\" class=\"scheme-card\" data-scheme=\"Salon\" aria-pressed=\"false\">\n            \u003cspan class=\"check\">01\u003c/span>\n            \u003cspan class=\"scheme-name\">Salon\u003c/span>\n        \u003c/button>\n\n        \u003cbutton type=\"button\" class=\"scheme-card\" data-scheme=\"Hospitality\" aria-pressed=\"false\">\n            \u003cspan class=\"check\">02\u003c/span>\n            \u003cspan class=\"scheme-name\">Hospitality\u003c/span>\n        \u003c/button>\n\n        \u003cbutton type=\"button\" class=\"scheme-card\" data-scheme=\"Product\" aria-pressed=\"false\">\n            \u003cspan class=\"check\">03\u003c/span>\n            \u003cspan class=\"scheme-name\">Product\u003c/span>\n        \u003c/button>\n\n        \u003cbutton type=\"button\" class=\"scheme-card\" data-scheme=\"Aesthetic\" aria-pressed=\"false\">\n            \u003cspan class=\"check\">04\u003c/span>\n            \u003cspan class=\"scheme-name\">Aesthetic\u003c/span>\n        \u003c/button>\n\n        \u003cbutton type=\"button\" class=\"scheme-card\" data-scheme=\"Packaging\" aria-pressed=\"false\">\n            \u003cspan class=\"check\">05\u003c/span>\n            \u003cspan class=\"scheme-name\">Packaging\u003c/span>\n        \u003c/button>\n\n    \u003c/div>\n\n    \u003cp class=\"selection-help\">\n        Click a scheme above to open its information.\n    \u003c/p>\n\n    \u003csection class=\"information-panel\" id=\"informationPanel\" hidden aria-live=\"polite\">\n\n        \u003cdiv class=\"scheme-number\" id=\"schemeNumber\">\u003c/div>\n        \u003ch2 id=\"schemeTitle\">\u003c/h2>\n        \u003cp id=\"schemeDescription\">\u003c/p>\n\n        \u003cdiv id=\"schemeInformation\">\u003c/div>\n\n        \u003cdiv class=\"actions\">\n            \u003cbutton type=\"button\" class=\"button button-back\" id=\"backButton\">\n                Back\n            \u003c/button>\n\n            \u003cbutton type=\"button\" class=\"button button-next\" id=\"selectSchemeButton\">\n                Select Scheme\n            \u003c/button>\n        \u003c/div>\n\n        \u003cp class=\"message\" id=\"schemeMessage\" role=\"status\">\u003c/p>\n\n    \u003c/section>\n\n\u003c/section>\n\u003c/main>\n\n\n\u003c!-- CLIENT ID POPUP -->\n\n\u003cdiv class=\"modal-overlay\" id=\"clientModal\" role=\"dialog\"\n     aria-modal=\"true\" aria-labelledby=\"modalTitle\">\n\n    \u003cdiv class=\"modal\">\n\n        \u003cdiv class=\"modal-mark\">✓\u003c/div>\n\n        \u003ch2 id=\"modalTitle\">Scheme Selected Successfully\u003c/h2>\n\n        \u003cp class=\"modal-description\">\n            Your scheme selection has been recorded.\n            A unique Client ID has been generated for your registration.\n            Please keep this ID for future reference.\n        \u003c/p>\n\n        \u003cspan class=\"client-id-label\">Your Client ID\u003c/span>\n\n        \u003cdiv class=\"client-id-display\" id=\"clientIDDisplay\">\u003c/div>\n\n        \u003cbutton type=\"button\" class=\"copy-button\" id=\"copyClientID\">\n            Copy Client ID\n        \u003c/button>\n\n        \u003cdiv class=\"copy-status\" id=\"copyStatus\" role=\"status\">\u003c/div>\n\n        \u003cbutton type=\"button\" class=\"continue-button\" id=\"continueDashboard\">\n            Continue to Dashboard\n        \u003c/button>\n\n    \u003c/div>\n\u003c/div>\n\n\n\u003cscript>\n\n// ==========================================\n// SCHEME INFORMATION\n// ==========================================\n\nconst schemeDetails = {\n\n    Salon: {\n        number: \"Scheme 01\",\n        description: \"Certification for salons, beauty bars, nail businesses, lash businesses and hair businesses.\",\n        standard: \"GC-SALON-STD-001 v1.1\",\n        gates: \"7\",\n        certification: \"60%\",\n        silver: \"75%\",\n        gold: \"85%\",\n        micro: \"55%\",\n        safeguards: [\n            \"A Chemical Safety: 18/30\",\n            \"B IAQ: 13/25\"\n        ],\n        validity: \"36 months\",\n        declaration: \"Yes\",\n        fees: [\n            \"Solo: R7,500\",\n            \"Small: R12,000\",\n            \"Mid: R18,500\",\n            \"Large: R28,000\"\n        ],\n        bonus: \"CR /5 (non-tier)\"\n    },\n\n    Hospitality: {\n        number: \"Scheme 02\",\n        description: \"Certification for hospitality businesses such as hotels, restaurants and cafes.\",\n        standard: \"v3.1 + ANNEX v2.1\",\n        gates: \"5\",\n        certification: \"60%\",\n        silver: \"75%\",\n        gold: \"85%\",\n        micro: \"54% (small ×0.9)\",\n        safeguards: [\n            \"A Guest Wellbeing: 10/20\",\n            \"B IAQ: 8/15\",\n            \"H Governance: 3/5\"\n        ],\n        validity: \"36 months\",\n        declaration: \"Yes\",\n        fees: [\n            \"Small: R12,500\",\n            \"Mid: R23,000\",\n            \"Large: R35,500\"\n        ],\n        bonus: \"Not applicable\"\n    },\n\n    Product: {\n        number: \"Scheme 03\",\n        description: \"Certification for product brands and businesses that manufacture or sell products.\",\n        standard: \"v3.1 + ANNEX v1.1\",\n        gates: \"5\",\n        certification: \"65%\",\n        silver: \"80%\",\n        gold: \"90%\",\n        micro: \"Risk ×1.2 / 1.0 / 0.9\",\n        safeguards: [\n            \"A Chemical Safety: 18/30\",\n            \"B Emissions: 10/20\"\n        ],\n        validity: \"36 months\",\n        declaration: \"Yes\",\n        fees: [\n            \"According to the applicable fee schedule\"\n        ],\n        bonus: \"NP /5 (non-tier)\"\n    },\n\n    Aesthetic: {\n        number: \"Scheme 04\",\n        description: \"Certification for aesthetic and beauty treatment businesses.\",\n        standard: \"GC-AEST-STD-001 v1.0\",\n        gates: \"8\",\n        certification: \"60%\",\n        silver: \"75%\",\n        gold: \"85%\",\n        micro: \"55%\",\n        safeguards: [\n            \"A Active Ingredients: 18/30\",\n            \"B Client Safety: 13/25\"\n        ],\n        validity: \"12 months\",\n        declaration: \"N/A – Annual\",\n        fees: [\n            \"Solo: R7,500\",\n            \"Small: R12,000\",\n            \"Mid: R18,500\",\n            \"Large: R28,000\"\n        ],\n        bonus: \"G bonus /3\"\n    },\n\n    Packaging: {\n        number: \"Scheme 05\",\n        description: \"Certification for packaging solutions and packaging-related businesses.\",\n        standard: \"GC-PACK-STD-001 v1.0\",\n        gates: \"5\",\n        certification: \"60%\",\n        silver: \"75%\",\n        gold: \"85%\",\n        micro: \"55% (micro converter)\",\n        safeguards: [\n            \"A Material & Chemical Safety: 18/30\",\n            \"B Recyclability & Design: 13/25\"\n        ],\n        validity: \"36 months\",\n        declaration: \"Yes\",\n        fees: [\n            \"Solo: R9,500\",\n            \"Small: R16,000\",\n            \"Mid: R26,000\",\n            \"Large: R42,000\"\n        ],\n        bonus: \"G bonus /3\"\n    }\n\n};\n\n\n// ==========================================\n// ELEMENTS\n// ==========================================\n\nconst schemeCards = document.querySelectorAll(\".scheme-card\");\nconst informationPanel = document.getElementById(\"informationPanel\");\nconst schemeNumber = document.getElementById(\"schemeNumber\");\nconst schemeTitle = document.getElementById(\"schemeTitle\");\nconst schemeDescription = document.getElementById(\"schemeDescription\");\nconst schemeInformation = document.getElementById(\"schemeInformation\");\nconst schemeMessage = document.getElementById(\"schemeMessage\");\nconst selectSchemeButton = document.getElementById(\"selectSchemeButton\");\nconst backButton = document.getElementById(\"backButton\");\n\nconst clientModal = document.getElementById(\"clientModal\");\nconst clientIDDisplay = document.getElementById(\"clientIDDisplay\");\nconst copyClientID = document.getElementById(\"copyClientID\");\nconst copyStatus = document.getElementById(\"copyStatus\");\nconst continueDashboard = document.getElementById(\"continueDashboard\");\n\nlet selectedScheme = \"\";\n\n\n// ==========================================\n// DISPLAY SCHEME INFORMATION\n// ==========================================\n\nfunction displaySchemeInformation(details) {\n\n    schemeInformation.innerHTML = \"\";\n\n    function addSection(title, items) {\n\n        const section = document.createElement(\"div\");\n        section.className = \"info-section\";\n\n        const heading = document.createElement(\"h3\");\n        heading.textContent = title;\n\n        const list = document.createElement(\"ul\");\n        list.className = \"info-list\";\n\n        items.forEach(function(item) {\n\n            const li = document.createElement(\"li\");\n\n            if (Array.isArray(item)) {\n                const strong = document.createElement(\"strong\");\n                strong.textContent = item[0] + \": \";\n\n                li.appendChild(strong);\n                li.appendChild(document.createTextNode(item[1]));\n            } else {\n                li.textContent = item;\n            }\n\n            list.appendChild(li);\n        });\n\n        section.appendChild(heading);\n        section.appendChild(list);\n        schemeInformation.appendChild(section);\n    }\n\n    addSection(\"Standard and Certification Requirements\", [\n        [\"Standard version\", details.standard],\n        [\"Number of gates\", details.gates],\n        [\"Certification minimum\", details.certification],\n        [\"Silver minimum\", details.silver],\n        [\"Gold minimum\", details.gold],\n        [\"Micro / Adjusted Certification minimum\", details.micro]\n    ]);\n\n    addSection(\"Safeguard Requirements\", details.safeguards);\n\n    addSection(\"Certification Validity and Declaration\", [\n        [\"Certificate validity\", details.validity],\n        [\"Declaration (Year 1 / Year 2)\", details.declaration]\n    ]);\n\n    addSection(\"Certification Fees\", details.fees);\n\n    addSection(\"Bonus Category\", [\n        [\"Bonus\", details.bonus]\n    ]);\n}\n\n\n// ==========================================\n// SCHEME CARD SELECTION\n// ==========================================\n\nschemeCards.forEach(function(card) {\n\n    card.addEventListener(\"click\", function() {\n\n        selectedScheme = card.dataset.scheme;\n\n        const details = schemeDetails[selectedScheme];\n\n        schemeCards.forEach(function(item) {\n\n            const active = item === card;\n\n            item.classList.toggle(\"active\", active);\n            item.setAttribute(\"aria-pressed\", String(active));\n\n        });\n\n        schemeNumber.textContent = details.number;\n        schemeTitle.textContent = selectedScheme + \" Scheme\";\n        schemeDescription.textContent = details.description;\n\n        displaySchemeInformation(details);\n\n        schemeMessage.textContent = \"\";\n        informationPanel.hidden = false;\n\n        informationPanel.scrollIntoView({\n            behavior: \"smooth\",\n            block: \"start\"\n        });\n\n    });\n\n});\n\n\n// ==========================================\n// BACK BUTTON\n// ==========================================\n\nbackButton.addEventListener(\"click\", function() {\n\n    informationPanel.hidden = true;\n    schemeMessage.textContent = \"\";\n    selectedScheme = \"\";\n\n    schemeCards.forEach(function(card) {\n        card.classList.remove(\"active\");\n        card.setAttribute(\"aria-pressed\", \"false\");\n    });\n\n});\n\n\n// ==========================================\n// UNIQUE CLIENT ID GENERATION\n// ==========================================\n\nfunction generateClientID(scheme) {\n\n    const prefixes = {\n        Salon: \"SAL\",\n        Hospitality: \"HOS\",\n        Product: \"PRO\",\n        Aesthetic: \"AES\",\n        Packaging: \"PAC\"\n    };\n\n    const prefix = prefixes[scheme];\n    const year = new Date().getFullYear();\n\n    const randomPart = crypto.randomUUID()\n        .replace(/-/g, \"\")\n        .substring(0, 12)\n        .toUpperCase();\n\n    return `GC-${prefix}-${year}-${randomPart}`;\n}\n\n\n// ==========================================\n// SELECT SCHEME AND SHOW CLIENT ID\n// ==========================================\n\nselectSchemeButton.addEventListener(\"click\", function() {\n\n    if (!selectedScheme) {\n        schemeMessage.textContent = \"Please select a scheme first.\";\n        return;\n    }\n\n    const clientID = generateClientID(selectedScheme);\n\n    // Save client information for the next pages\n\n    const clientData = {\n        clientID: clientID,\n        selectedScheme: selectedScheme,\n        createdAt: new Date().toISOString()\n    };\n\n    localStorage.setItem(\"gaiaClientData\", JSON.stringify(clientData));\n\n    sessionStorage.setItem(\"clientID\", clientID);\n    sessionStorage.setItem(\"selectedScheme\", selectedScheme);\n\n    // Display the generated ID\n\n    clientIDDisplay.textContent = clientID;\n    copyStatus.textContent = \"\";\n\n    clientModal.classList.add(\"show\");\n\n    copyClientID.focus();\n\n});\n\n\n// ==========================================\n// COPY CLIENT ID\n// ==========================================\n\ncopyClientID.addEventListener(\"click\", async function() {\n\n    const clientID = clientIDDisplay.textContent;\n\n    try {\n\n        await navigator.clipboard.writeText(clientID);\n\n        copyStatus.textContent = \"Client ID copied successfully.\";\n\n        copyClientID.textContent = \"Copied ✓\";\n\n    } catch (error) {\n\n        // Fallback for browsers without clipboard access\n\n        const temp = document.createElement(\"textarea\");\n        temp.value = clientID;\n\n        document.body.appendChild(temp);\n        temp.select();\n\n        const copied = document.execCommand(\"copy\");\n\n        temp.remove();\n\n        copyStatus.textContent = copied\n            ? \"Client ID copied successfully.\"\n            : \"Please select and copy your Client ID manually.\";\n\n    }\n\n});\n\n\n// ==========================================\n// CONTINUE TO DASHBOARD\n// ==========================================\n\ncontinueDashboard.addEventListener(\"click\", function() {\n\n    parent.gaiaGo(\"dashboard\");\n\n});\n\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n",
    "dashboard": "\n\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#17392d\">\n\u003ctitle>Gaia Conscious | Client Dashboard\u003c/title>\n\n\u003cstyle>\n:root {\n    --green: #17392d;\n    --green-light: #285542;\n    --sage: #eaf0e7;\n    --line: #dce3da;\n    --muted: #687168;\n    --white: #ffffff;\n    --surface: #f8faf8;\n}\n\n* {\n    box-sizing: border-box;\n}\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    background: var(--white);\n    color: var(--green);\n    font-family: Arial, Helvetica, sans-serif;\n}\n\nbutton, a {\n    font: inherit;\n}\n\n.dashboard-layout {\n    display: flex;\n    min-height: 100vh;\n}\n\n/* SIDEBAR */\n\n.sidebar {\n    width: 250px;\n    min-width: 250px;\n    min-height: 100vh;\n    position: sticky;\n    top: 0;\n    height: 100vh;\n    display: flex;\n    flex-direction: column;\n    background: var(--green);\n    color: white;\n}\n\n.sidebar-brand {\n    min-height: 112px;\n    display: flex;\n    align-items: center;\n    gap: 13px;\n    padding: 22px 20px;\n    border-bottom: 1px solid rgba(255,255,255,.14);\n}\n\n.sidebar-brand img {\n    width: 62px;\n    height: 62px;\n    object-fit: contain;\n    object-position: center;\n    flex-shrink: 0;\n}\n\n.brand-name {\n    font-size: 13px;\n    font-weight: 700;\n    letter-spacing: 1px;\n}\n\n.brand-subtitle {\n    margin-top: 5px;\n    color: rgba(255,255,255,.65);\n    font-size: 9px;\n    letter-spacing: 1.3px;\n}\n\n.menu-heading {\n    padding: 27px 22px 11px;\n    color: rgba(255,255,255,.55);\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 1.6px;\n    text-transform: uppercase;\n}\n\n.sidebar-menu {\n    display: flex;\n    flex-direction: column;\n    gap: 5px;\n    padding: 0 12px;\n}\n\n.menu-item {\n    display: flex;\n    align-items: center;\n    gap: 13px;\n    width: 100%;\n    padding: 12px 14px;\n    border: none;\n    border-radius: 6px;\n    background: transparent;\n    color: rgba(255,255,255,.8);\n    text-align: left;\n    text-decoration: none;\n    font-size: 13px;\n    cursor: pointer;\n}\n\n.menu-item:hover,\n.menu-item.active {\n    background: rgba(255,255,255,.14);\n    color: white;\n}\n\n.menu-item.active {\n    font-weight: 700;\n}\n\n.menu-icon {\n    width: 20px;\n    text-align: center;\n    font-size: 17px;\n}\n\n.sidebar-bottom {\n    margin-top: auto;\n    padding: 16px 12px 20px;\n    border-top: 1px solid rgba(255,255,255,.14);\n}\n\n.logout-button {\n    display: flex;\n    align-items: center;\n    gap: 13px;\n    width: 100%;\n    padding: 12px 14px;\n    border: none;\n    border-radius: 6px;\n    background: transparent;\n    color: white;\n    text-align: left;\n    font-size: 13px;\n    cursor: pointer;\n}\n\n.logout-button:hover {\n    background: rgba(255,255,255,.14);\n}\n\n.sidebar-note {\n    margin: 13px 14px 0;\n    color: rgba(255,255,255,.5);\n    font-size: 9px;\n    line-height: 1.7;\n}\n\n/* MAIN AREA */\n\n.main-area {\n    flex: 1;\n    min-width: 0;\n    background: var(--surface);\n}\n\n.top-header {\n    min-height: 78px;\n    padding: 0 38px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    border-bottom: 1px solid var(--line);\n    background: white;\n}\n\n.header-title {\n    font-size: 14px;\n    font-weight: 700;\n    letter-spacing: .5px;\n}\n\n.header-subtitle {\n    margin-top: 5px;\n    color: var(--muted);\n    font-size: 11px;\n}\n\n.header-right {\n    display: flex;\n    align-items: center;\n    gap: 11px;\n}\n\n.header-user-name {\n    font-size: 12px;\n    color: var(--muted);\n}\n\n.user-initial {\n    width: 38px;\n    height: 38px;\n    display: grid;\n    place-items: center;\n    border-radius: 50%;\n    background: var(--sage);\n    color: var(--green);\n    font-weight: 700;\n}\n\n/* DASHBOARD CONTENT */\n\n.dashboard-content {\n    max-width: 1500px;\n    margin: auto;\n    padding: 34px 38px 48px;\n}\n\n.welcome-row {\n    display: flex;\n    align-items: flex-start;\n    justify-content: space-between;\n    gap: 20px;\n}\n\n.eyebrow {\n    margin-bottom: 10px;\n    color: var(--green-light);\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 1.8px;\n    text-transform: uppercase;\n}\n\nh1 {\n    margin: 0 0 9px;\n    font-size: clamp(26px, 3vw, 34px);\n    font-weight: 500;\n}\n\n.welcome-copy {\n    margin: 0;\n    color: var(--muted);\n    font-size: 13px;\n    line-height: 1.7;\n}\n\n/* CLIENT ID */\n\n.client-information {\n    min-width: 300px;\n    max-width: 390px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 15px;\n    padding: 16px 18px;\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    background: white;\n}\n\n.client-label {\n    display: block;\n    margin-bottom: 7px;\n    color: var(--muted);\n    font-size: 9px;\n    font-weight: 700;\n    letter-spacing: 1.3px;\n    text-transform: uppercase;\n}\n\n.client-id {\n    font-size: 14px;\n    font-weight: 700;\n    overflow-wrap: anywhere;\n}\n\n.copy-client-button {\n    flex-shrink: 0;\n    padding: 9px 12px;\n    border: 1px solid var(--green);\n    border-radius: 5px;\n    background: white;\n    color: var(--green);\n    font-size: 11px;\n    font-weight: 700;\n    cursor: pointer;\n}\n\n.copy-client-button:hover {\n    background: var(--sage);\n}\n\n.copy-message {\n    margin-top: 6px;\n    color: var(--green-light);\n    font-size: 10px;\n}\n\n/* SCHEME BANNER */\n\n.scheme-banner {\n    margin-top: 28px;\n    overflow: hidden;\n    border: 1px solid var(--line);\n    border-radius: 9px;\n    background: white;\n}\n\n.scheme-banner-top {\n    padding: 21px 24px 18px;\n    text-align: center;\n}\n\n.scheme-name {\n    font-size: 25px;\n    font-weight: 600;\n}\n\n.scheme-status {\n    padding: 12px;\n    background: var(--green);\n    color: white;\n    text-align: center;\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 1px;\n}\n\n/* OVERVIEW CARDS */\n\n.section-heading {\n    margin: 30px 0 14px;\n    font-size: 16px;\n    font-weight: 700;\n}\n\n.metrics-grid {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 15px;\n}\n\n.metric-card {\n    min-height: 132px;\n    display: flex;\n    flex-direction: column;\n    justify-content: space-between;\n    overflow: hidden;\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    background: white;\n}\n\n.metric-main {\n    min-height: 88px;\n    display: grid;\n    place-items: center;\n    padding: 15px;\n    text-align: center;\n}\n\n.metric-value {\n    color: var(--green);\n    font-size: 22px;\n    font-weight: 600;\n}\n\n.metric-label {\n    padding: 11px 8px;\n    background: var(--green);\n    color: white;\n    text-align: center;\n    font-size: 11px;\n}\n\n/* CONTENT PANELS */\n\n.content-grid {\n    display: grid;\n    grid-template-columns: 1.15fr .85fr;\n    gap: 16px;\n    margin-top: 16px;\n}\n\n.panel {\n    padding: 21px;\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    background: white;\n    min-width: 0;\n}\n\n.panel h2 {\n    margin: 0 0 16px;\n    font-size: 15px;\n}\n\n.panel-description {\n    margin: -7px 0 17px;\n    color: var(--muted);\n    font-size: 11px;\n    line-height: 1.6;\n}\n\n.progress-track {\n    height: 8px;\n    overflow: hidden;\n    border-radius: 20px;\n    background: var(--sage);\n}\n\n.progress-fill {\n    width: 0;\n    height: 100%;\n    border-radius: inherit;\n    background: var(--green-light);\n}\n\n.progress-caption {\n    display: flex;\n    justify-content: space-between;\n    margin-top: 9px;\n    color: var(--muted);\n    font-size: 10px;\n}\n\n.status-list {\n    display: grid;\n}\n\n.status-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n    padding: 12px 0;\n    border-top: 1px solid var(--line);\n    font-size: 12px;\n}\n\n.status-row:first-child {\n    border-top: none;\n}\n\n.status-pill {\n    padding: 5px 9px;\n    border-radius: 20px;\n    background: var(--sage);\n    color: var(--green);\n    font-size: 10px;\n    white-space: nowrap;\n}\n\n.next-step {\n    display: flex;\n    gap: 12px;\n    padding: 13px;\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    background: var(--surface);\n}\n\n.next-step-icon {\n    width: 28px;\n    height: 28px;\n    display: grid;\n    place-items: center;\n    flex-shrink: 0;\n    border-radius: 50%;\n    background: var(--sage);\n}\n\n.next-step strong {\n    display: block;\n    margin-bottom: 5px;\n    font-size: 12px;\n}\n\n.next-step p {\n    margin: 0;\n    color: var(--muted);\n    font-size: 11px;\n    line-height: 1.6;\n}\n\n.activity-empty {\n    color: var(--muted);\n    font-size: 11px;\n    line-height: 1.7;\n}\n\n/* ORGANISATION */\n\n.info-list {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 17px 20px;\n}\n\n.info-label {\n    display: block;\n    margin-bottom: 6px;\n    color: var(--muted);\n    font-size: 9px;\n    font-weight: 700;\n    letter-spacing: 1px;\n    text-transform: uppercase;\n}\n\n.info-value {\n    color: var(--green);\n    font-size: 12px;\n    overflow-wrap: anywhere;\n}\n\n.page-footer {\n    padding: 20px 38px;\n    border-top: 1px solid var(--line);\n    color: var(--muted);\n    font-size: 10px;\n    background: white;\n}\n\n/* RESPONSIVE */\n\n@media (max-width: 1050px) {\n    .metrics-grid {\n        grid-template-columns: repeat(2, 1fr);\n    }\n\n    .welcome-row {\n        flex-direction: column;\n    }\n\n    .client-information {\n        width: 100%;\n        max-width: 500px;\n    }\n}\n\n@media (max-width: 760px) {\n    .sidebar {\n        width: 72px;\n        min-width: 72px;\n    }\n\n    .sidebar-brand {\n        justify-content: center;\n        padding: 18px 5px;\n    }\n\n    .sidebar-brand img {\n        width: 48px;\n        height: 48px;\n    }\n\n    .sidebar-brand > div,\n    .menu-heading,\n    .menu-text,\n    .sidebar-note {\n        display: none;\n    }\n\n    .sidebar-menu {\n        padding: 12px 7px;\n    }\n\n    .menu-item,\n    .logout-button {\n        justify-content: center;\n        padding: 13px 5px;\n    }\n\n    .top-header {\n        padding: 0 18px;\n    }\n\n    .dashboard-content {\n        padding: 26px 18px;\n    }\n\n    .content-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .page-footer {\n        padding: 17px 18px;\n    }\n}\n\n@media (max-width: 480px) {\n    .metrics-grid {\n        gap: 9px;\n    }\n\n    .metric-value {\n        font-size: 18px;\n    }\n\n    .client-information {\n        min-width: 0;\n    }\n\n    .info-list {\n        grid-template-columns: 1fr;\n    }\n\n    .header-user-name {\n        display: none;\n    }\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n\u003cdiv class=\"dashboard-layout\">\n\n    \u003c!-- LEFT SIDEBAR -->\n\n    \u003caside class=\"sidebar\">\n\n        \u003cdiv class=\"sidebar-brand\">\n            \u003cimg src=\"assets/emblem.png\" alt=\"Gaia Conscious logo\">\n            \u003cdiv>\n                \u003cdiv class=\"brand-name\">GAIA CONSCIOUS\u003c/div>\n                \u003cdiv class=\"brand-subtitle\">CLIENT PORTAL\u003c/div>\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"menu-heading\">Main Menu\u003c/div>\n\n        \u003cnav class=\"sidebar-menu\">\n\n            \u003ca class=\"menu-item active\" href=\"#dashboard\">\n                \u003cspan class=\"menu-text\">Dashboard\u003c/span>\n            \u003c/a>\n\n            \u003ca class=\"menu-item\" href=\"application.html\">\n                \u003cspan class=\"menu-text\">Application Overview\u003c/span>\n            \u003c/a>\n\n            \u003ca class=\"menu-item\" href=\"#documents\">\n                \u003cspan class=\"menu-text\">Documents\u003c/span>\n            \u003c/a>\n\n            \u003ca class=\"menu-item\" href=\"#assessment\">\n                \u003cspan class=\"menu-text\">Assessment\u003c/span>\n            \u003c/a>\n\n            \u003ca class=\"menu-item\" href=\"#reports\">\n                \u003cspan class=\"menu-text\">Reports\u003c/span>\n            \u003c/a>\n\n            \u003ca class=\"menu-item\" href=\"#certification\">\n                \u003cspan class=\"menu-text\">Certification\u003c/span>\n            \u003c/a>\n\n            \u003ca class=\"menu-item\" href=\"#organisation\">\n                \u003cspan class=\"menu-text\">Organisation\u003c/span>\n            \u003c/a>\n\n        \u003c/nav>\n\n        \u003cdiv class=\"menu-heading\">Account\u003c/div>\n\n        \u003cnav class=\"sidebar-menu\">\n            \u003ca class=\"menu-item\" href=\"#organisation\">\n                \u003cspan class=\"menu-text\">Account Information\u003c/span>\n            \u003c/a>\n        \u003c/nav>\n\n        \u003c!-- LOGOUT AT BOTTOM -->\n\n        \u003cdiv class=\"sidebar-bottom\">\n\n            \u003cbutton class=\"logout-button\" id=\"logoutButton\">\n                \u003cspan class=\"menu-text\">Log Out\u003c/span>\n            \n\n        \u003c/div>\n\n    \u003c/aside>\n\n\n    \u003c!-- MAIN DASHBOARD -->\n\n    \u003cmain class=\"main-area\" id=\"dashboard\">\n\n        \u003c!-- HEADER -->\n\n        \u003cheader class=\"top-header\">\n\n            \u003cdiv>\n                \u003cdiv class=\"header-title\">CLIENT DASHBOARD\u003c/div>\n                \u003cdiv class=\"header-subtitle\">\n                    Gaia Conscious Certification Portal\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"header-right\">\n\n                \u003cspan class=\"header-user-name\" id=\"headerUserName\">\n                    Client account\n                \u003c/span>\n\n                \u003cdiv class=\"user-initial\" id=\"userInitial\">G\u003c/div>\n\n            \u003c/div>\n\n        \u003c/header>\n\n\n        \u003csection class=\"dashboard-content\">\n\n            \u003c!-- WELCOME -->\n\n            \u003cdiv class=\"welcome-row\">\n\n                \u003cdiv>\n                    \u003cdiv class=\"eyebrow\">CLIENT PORTAL\u003c/div>\n\n                    \u003ch1 id=\"welcomeName\">Welcome\u003c/h1>\n\n                    \u003cp class=\"welcome-copy\">\n                    \u003c/p>\n                \u003c/div>\n\n\n                \u003c!-- CLIENT ID -->\n\n                \u003cdiv class=\"client-information\">\n\n                    \u003cdiv>\n                        \u003cspan class=\"client-label\">YOUR CLIENT ID\u003c/span>\n\n                        \u003cdiv class=\"client-id\" id=\"dashboardClientID\">\n                            Loading...\n                        \u003c/div>\n\n                        \u003cdiv class=\"copy-message\" id=\"copyMessage\">\u003c/div>\n                    \u003c/div>\n\n                    \u003cbutton\n                        type=\"button\"\n                        class=\"copy-client-button\"\n                        id=\"dashboardCopyButton\">\n                        Copy ID\n                    \u003c/button>\n\n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003c!-- SELECTED SCHEME -->\n\n            \u003cdiv class=\"scheme-banner\">\n\n                \u003cdiv class=\"scheme-banner-top\">\n\n                    \u003cdiv class=\"eyebrow\">\n                        SELECTED CERTIFICATION SCHEME\n                    \u003c/div>\n\n                    \u003cdiv class=\"scheme-name\" id=\"schemeName\">\n                        Scheme not selected\n                    \u003c/div>\n\n                \u003c/div>\n\n                \u003cdiv class=\"scheme-status\" id=\"schemeStatus\">\n                    APPLICATION \n                \u003c/div>\n\n            \u003c/div>\n\n\n            \u003c!-- OVERVIEW -->\n\n            \u003ch2 class=\"section-heading\">\n                Certification Overview\n            \u003c/h2>\n\n            \u003cdiv class=\"metrics-grid\" id=\"application\">\n\n                \u003carticle class=\"metric-card\" id=\"documents\">\n\n                    \u003cdiv class=\"metric-main\">\n                        \u003cdiv class=\"metric-value\" id=\"documentsValue\">\n                            Pending\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"metric-label\">\n                        Documents Submitted\n                    \u003c/div>\n\n                \u003c/article>\n\n\n                \u003carticle class=\"metric-card\" id=\"reports\">\n\n                    \u003cdiv class=\"metric-main\">\n                        \u003cdiv class=\"metric-value\" id=\"reportsValue\">\n                            Pending\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"metric-label\">\n                        Reports\n                    \u003c/div>\n\n                \u003c/article>\n\n\n                \u003carticle class=\"metric-card\" id=\"assessment\">\n\n                    \u003cdiv class=\"metric-main\">\n                        \u003cdiv class=\"metric-value\" id=\"assessmentValue\">\n                            Not Scheduled\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"metric-label\">\n                        Assessment\n                    \u003c/div>\n\n                \u003c/article>\n\n\n                \u003carticle class=\"metric-card\" id=\"certification\">\n\n                    \u003cdiv class=\"metric-main\">\n                        \u003cdiv class=\"metric-value\" id=\"decisionValue\">\n                            Pending\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"metric-label\">\n                        Certification Decision\n                    \u003c/div>\n\n                \u003c/article>\n\n            \u003c/div>\n\n\n            \u003c!-- PROGRESS AND NEXT STEP -->\n\n            \u003cdiv class=\"content-grid\">\n\n                \u003csection class=\"panel\">\n\n                    \u003ch2>Application Progress\u003c/h2>\n\n                    \u003cp class=\"panel-description\">\n                    \u003c/p>\n\n                    \u003cdiv class=\"progress-track\">\n                        \u003cdiv class=\"progress-fill\" id=\"progressFill\">\u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"progress-caption\">\n                        \u003cspan id=\"progressText\">\n                            Application not yet updated\n                        \u003c/span>\n\n                        \u003cspan id=\"progressPercent\">—\u003c/span>\n                    \u003c/div>\n\n\n                    \u003cdiv class=\"status-list\" style=\"margin-top:18px\">\n\n                        \u003cdiv class=\"status-row\">\n                            \u003cspan>Registration\u003c/span>\n                            \u003cspan class=\"status-pill\">Recorded at sign-up\u003c/span>\n                        \u003c/div>\n\n                        \u003cdiv class=\"status-row\">\n                            \u003cspan>Document Review\u003c/span>\n                            \u003cspan class=\"status-pill\">Awaiting update\u003c/span>\n                        \u003c/div>\n\n                        \u003cdiv class=\"status-row\">\n                            \u003cspan>Assessment\u003c/span>\n                            \u003cspan class=\"status-pill\">Awaiting schedule\u003c/span>\n                        \u003c/div>\n\n                        \u003cdiv class=\"status-row\">\n                            \u003cspan>Certification Decision\u003c/span>\n                            \u003cspan class=\"status-pill\">Not yet issued\u003c/span>\n                        \u003c/div>\n\n                    \u003c/div>\n\n                \u003c/section>\n\n\n                \u003csection class=\"panel\">\n\n                    \u003ch2>Next Step\u003c/h2>\n\n                    \u003cdiv class=\"next-step\">\n\n                        \u003cdiv class=\"next-step-icon\">\u003c/div>\n\n                        \u003cdiv>\n                            \u003cstrong>Check Your Application Requirements\u003c/strong>\n\n                            \u003cp>\n                                 Outstanding information, appliaction updates \n                                and deadline (reminder).\n                            \u003c/p>\n                        \u003c/div>\n\n                    \u003c/div>\n\n\n                    \u003ch2 style=\"margin-top:23px\">\n                        Updates & Notifications\n                    \u003c/h2>\n\n                    \u003cp class=\"activity-empty\" id=\"activityMessage\">\n                        updates and notification \n\n                \u003c/section>\n\n            \u003c/div>\n\n\n            \u003c!-- ORGANISATION INFORMATION -->\n\n            \u003csection class=\"panel\" id=\"organisation\"\n                style=\"margin-top:16px\">\n\n                \u003ch2>Organisation Information\u003c/h2>\n\n                \u003cdiv class=\"info-list\">\n\n                    \u003cdiv>\n                        \u003cspan class=\"info-label\">Organisation Name\u003c/span>\n                        \u003cspan class=\"info-value\" id=\"organisationName\">\n                            Not provided\n                        \u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv>\n                        \u003cspan class=\"info-label\">Contact Person\u003c/span>\n                        \u003cspan class=\"info-value\" id=\"contactName\">\n                            Not provided\n                        \u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv>\n                        \u003cspan class=\"info-label\">Selected Scheme\u003c/span>\n                        \u003cspan class=\"info-value\" id=\"organisationScheme\">\n                            Not selected\n                        \u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv>\n                        \u003cspan class=\"info-label\">Client ID\u003c/span>\n                        \u003cspan class=\"info-value\" id=\"organisationClientID\">\n                            Not available\n                        \u003c/span>\n                    \u003c/div>\n\n                \u003c/div>\n\n            \u003c/section>\n\n        \u003c/section>\n\n\n      \n    \u003c/main>\n\n\u003c/div>\n\n\n\u003c!-- JAVASCRIPT -->\n\n\u003cscript>\n\n/* RETRIEVE REGISTERED INFORMATION */\n\nfunction getStoredValue(key) {\n\n    return sessionStorage.getItem(key)\n        || localStorage.getItem(key)\n        || \"\";\n\n}\n\n\nlet savedClientData = {};\n\ntry {\n\n    savedClientData = JSON.parse(\n        localStorage.getItem(\"gaiaClientData\") || \"{}\"\n    );\n\n} catch (error) {\n\n    savedClientData = {};\n\n}\n\n\nconst firstName = getStoredValue(\"firstName\");\n\nconst lastName = getStoredValue(\"lastName\");\n\nconst businessName =\n    getStoredValue(\"business\")\n    || savedClientData.business\n    || \"\";\n\nconst fullName =\n    [firstName, lastName].filter(Boolean).join(\" \").trim();\n\nconst displayName =\n    fullName || businessName || \"Client\";\n\n\n/* CLIENT ID */\n\nconst clientID =\n    getStoredValue(\"clientID\")\n    || savedClientData.clientID\n    || \"\";\n\n\n/* SELECTED SCHEME */\n\nconst selectedScheme =\n    getStoredValue(\"selectedScheme\")\n    || savedClientData.selectedScheme\n    || \"\";\n\n\n/* DISPLAY USER INFORMATION */\n\ndocument.getElementById(\"welcomeName\").textContent =\n    \"Welcome, \" + displayName;\n\ndocument.getElementById(\"headerUserName\").textContent =\n    displayName;\n\ndocument.getElementById(\"userInitial\").textContent =\n    displayName.charAt(0).toUpperCase();\n\n\n/* DISPLAY CLIENT ID */\n\ndocument.getElementById(\"dashboardClientID\").textContent =\n    clientID || \"Client ID unavailable\";\n\ndocument.getElementById(\"organisationClientID\").textContent =\n    clientID || \"Not available\";\n\n\n/* DISPLAY SCHEME */\n\ndocument.getElementById(\"schemeName\").textContent =\n    selectedScheme || \"Scheme not selected\";\n\ndocument.getElementById(\"organisationScheme\").textContent =\n    selectedScheme || \"Not selected\";\n\n\n/* ORGANISATION DETAILS */\n\ndocument.getElementById(\"organisationName\").textContent =\n    businessName || \"Not provided\";\n\ndocument.getElementById(\"contactName\").textContent =\n    fullName || \"Not provided\";\n\n\n/* CURRENT YEAR */\n\ndocument.getElementById(\"currentYear\").textContent =\n    new Date().getFullYear();\n\n\n/* COPY CLIENT ID */\n\ndocument.getElementById(\"dashboardCopyButton\")\n.addEventListener(\"click\", async function() {\n\n    const message =\n        document.getElementById(\"copyMessage\");\n\n    if (!clientID) {\n\n        message.textContent =\n            \"No Client ID is available to copy.\";\n\n        return;\n\n    }\n\n    try {\n\n        await navigator.clipboard.writeText(clientID);\n\n        message.textContent =\n            \"Client ID copied successfully.\";\n\n        this.textContent = \"Copied ✓\";\n\n    } catch (error) {\n\n        const field = document.createElement(\"textarea\");\n\n        field.value = clientID;\n\n        document.body.appendChild(field);\n\n        field.select();\n\n        const copied = document.execCommand(\"copy\");\n\n        field.remove();\n\n        message.textContent = copied\n            ? \"Client ID copied successfully.\"\n            : \"Please copy your Client ID manually.\";\n\n        if (copied) {\n            this.textContent = \"Copied ✓\";\n        }\n\n    }\n\n});\n\n\n/* LOG OUT */\n\ndocument.getElementById(\"logoutButton\")\n.addEventListener(\"click\", function() {\n\n    if (confirm(\"Are you sure you want to log out?\")) {\n\n        sessionStorage.clear();\n\n        parent.gaiaGo(\"login\");\n\n    }\n\n});\n\n\n/* SIDEBAR ACTIVE MENU */\n\ndocument.querySelectorAll(\".sidebar-menu a\")\n.forEach(function(link) {\n\n    link.addEventListener(\"click\", function() {\n\n        document.querySelectorAll(\".sidebar-menu a\")\n        .forEach(item => item.classList.remove(\"active\"));\n\n        this.classList.add(\"active\");\n\n    });\n\n});\n\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n\n",
    "application": "\n\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003cmeta name=\"theme-color\" content=\"#17392d\">\n\u003ctitle>Gaia Conscious | Application Overview\u003c/title>\n\n\u003cstyle>\n:root {\n    --green: #17392d;\n    --green-light: #285542;\n    --sage: #eaf0e7;\n    --line: #dce3da;\n    --muted: #687168;\n    --white: #ffffff;\n    --surface: #f8faf8;\n}\n\n* { box-sizing: border-box; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    background: var(--surface);\n    color: var(--green);\n    font-family: Arial, Helvetica, sans-serif;\n}\n\nbutton, a, select { font: inherit; }\n\n.layout {\n    display: flex;\n    min-height: 100vh;\n}\n\n/* SIDEBAR */\n\n.sidebar {\n    width: 250px;\n    min-width: 250px;\n    height: 100vh;\n    position: sticky;\n    top: 0;\n    display: flex;\n    flex-direction: column;\n    background: var(--green);\n    color: white;\n}\n\n.sidebar-brand {\n    min-height: 112px;\n    display: flex;\n    align-items: center;\n    gap: 13px;\n    padding: 20px;\n    border-bottom: 1px solid rgba(255,255,255,.14);\n}\n\n.sidebar-brand img {\n    width: 62px;\n    height: 62px;\n    object-fit: contain;\n    flex-shrink: 0;\n}\n\n.brand-name {\n    font-size: 13px;\n    font-weight: 700;\n    letter-spacing: 1px;\n}\n\n.brand-subtitle {\n    margin-top: 5px;\n    font-size: 9px;\n    color: rgba(255,255,255,.65);\n    letter-spacing: 1.3px;\n}\n\n.menu-heading {\n    padding: 27px 22px 11px;\n    color: rgba(255,255,255,.55);\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 1.5px;\n    text-transform: uppercase;\n}\n\n.sidebar-menu {\n    display: flex;\n    flex-direction: column;\n    gap: 5px;\n    padding: 0 12px;\n}\n\n.menu-item {\n    display: flex;\n    align-items: center;\n    gap: 13px;\n    width: 100%;\n    padding: 12px 14px;\n    border-radius: 6px;\n    color: rgba(255,255,255,.8);\n    text-decoration: none;\n    font-size: 13px;\n    cursor: pointer;\n}\n\n.menu-item:hover,\n.menu-item.active {\n    background: rgba(255,255,255,.14);\n    color: white;\n}\n\n.menu-item.active { font-weight: 700; }\n\n.menu-icon {\n    width: 20px;\n    text-align: center;\n    font-size: 16px;\n}\n\n.sidebar-bottom {\n    margin-top: auto;\n    padding: 16px 12px 20px;\n    border-top: 1px solid rgba(255,255,255,.14);\n}\n\n.logout-button {\n    width: 100%;\n    padding: 12px 14px;\n    border: none;\n    border-radius: 6px;\n    background: transparent;\n    color: white;\n    text-align: left;\n    font-size: 13px;\n    cursor: pointer;\n}\n\n.logout-button:hover {\n    background: rgba(255,255,255,.14);\n}\n\n/* MAIN */\n\n.main-area {\n    flex: 1;\n    min-width: 0;\n}\n\n.top-header {\n    min-height: 78px;\n    padding: 0 38px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    background: white;\n    border-bottom: 1px solid var(--line);\n}\n\n.header-title {\n    font-size: 14px;\n    font-weight: 700;\n    letter-spacing: .5px;\n}\n\n.header-subtitle {\n    margin-top: 5px;\n    color: var(--muted);\n    font-size: 11px;\n}\n\n.header-right {\n    display: flex;\n    align-items: center;\n    gap: 11px;\n}\n\n.header-user-name {\n    color: var(--muted);\n    font-size: 12px;\n}\n\n.user-initial {\n    width: 38px;\n    height: 38px;\n    display: grid;\n    place-items: center;\n    border-radius: 50%;\n    background: var(--sage);\n    font-weight: 700;\n}\n\n.content {\n    max-width: 1500px;\n    margin: auto;\n    padding: 34px 38px 50px;\n}\n\n/* PAGE HEADING */\n\n.eyebrow {\n    margin-bottom: 10px;\n    color: var(--green-light);\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 1.7px;\n    text-transform: uppercase;\n}\n\n.page-heading {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    gap: 20px;\n}\n\nh1 {\n    margin: 0 0 9px;\n    font-size: 30px;\n    font-weight: 500;\n}\n\n.intro {\n    margin: 0;\n    color: var(--muted);\n    font-size: 12px;\n    line-height: 1.7;\n}\n\n.reference-card {\n    min-width: 220px;\n    padding: 16px 18px;\n    border: 1px solid var(--line);\n    border-radius: 7px;\n    background: white;\n}\n\n.reference-label,\n.detail-label {\n    display: block;\n    margin-bottom: 7px;\n    color: var(--muted);\n    font-size: 9px;\n    font-weight: 700;\n    letter-spacing: 1.1px;\n    text-transform: uppercase;\n}\n\n.reference-value {\n    font-size: 15px;\n    font-weight: 700;\n    overflow-wrap: anywhere;\n}\n\n/* GENERAL PANELS */\n\n.panel {\n    margin-top: 22px;\n    padding: 23px;\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    background: white;\n}\n\n.panel h2 {\n    margin: 0 0 7px;\n    font-size: 16px;\n}\n\n.panel-description {\n    margin: 0 0 20px;\n    color: var(--muted);\n    font-size: 11px;\n    line-height: 1.7;\n}\n\n.section-heading {\n    margin: 30px 0 14px;\n    font-size: 16px;\n}\n\n/* APPLICATION DETAILS */\n\n.details-grid {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0,1fr));\n    gap: 22px;\n}\n\n.detail-value {\n    font-size: 12px;\n    overflow-wrap: anywhere;\n}\n\n/* SCHEME */\n\n.scheme-banner {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 15px;\n    padding: 18px 21px;\n    border: 1px solid var(--line);\n    border-radius: 7px;\n    background: white;\n}\n\n.scheme-name {\n    font-size: 20px;\n    font-weight: 600;\n}\n\n.stage-label {\n    padding: 8px 13px;\n    border-radius: 4px;\n    background: var(--sage);\n    color: var(--green);\n    font-size: 10px;\n    font-weight: 700;\n}\n\n/* NINE STAGE TRACKER */\n\n.stage-grid {\n    display: grid;\n    grid-template-columns: repeat(3, minmax(0,1fr));\n    gap: 12px;\n}\n\n.stage-card {\n    position: relative;\n    min-height: 112px;\n    padding: 16px;\n    border: 1px solid var(--line);\n    border-radius: 7px;\n    background: white;\n}\n\n.stage-number {\n    width: 25px;\n    height: 25px;\n    display: grid;\n    place-items: center;\n    margin-bottom: 12px;\n    border-radius: 50%;\n    background: #edf0ed;\n    color: var(--muted);\n    font-size: 11px;\n    font-weight: 700;\n}\n\n.stage-name {\n    margin-bottom: 8px;\n    font-size: 12px;\n    font-weight: 700;\n}\n\n.stage-status {\n    color: var(--muted);\n    font-size: 10px;\n}\n\n.stage-card.completed {\n    border-color: #b8cbbb;\n}\n\n.stage-card.completed .stage-number {\n    background: var(--green);\n    color: white;\n}\n\n.stage-card.current {\n    border: 2px solid var(--green-light);\n    background: #f8fbf8;\n}\n\n.stage-card.current .stage-number {\n    background: var(--green-light);\n    color: white;\n}\n\n.stage-card.current .stage-status {\n    color: var(--green);\n    font-weight: 700;\n}\n\n/* PROGRESS */\n\n.progress-track {\n    height: 8px;\n    margin-top: 18px;\n    overflow: hidden;\n    border-radius: 20px;\n    background: var(--sage);\n}\n\n.progress-fill {\n    width: 0;\n    height: 100%;\n    background: var(--green-light);\n    border-radius: inherit;\n    transition: width .3s ease;\n}\n\n.progress-caption {\n    display: flex;\n    justify-content: space-between;\n    margin-top: 9px;\n    color: var(--muted);\n    font-size: 10px;\n}\n\n/* TWO COLUMN PANELS */\n\n.two-column {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 16px;\n}\n\n.two-column .panel {\n    margin-top: 16px;\n}\n\n/* TABLES */\n\n.table-wrap {\n    width: 100%;\n    overflow-x: auto;\n}\n\ntable {\n    width: 100%;\n    border-collapse: collapse;\n    text-align: left;\n    font-size: 11px;\n}\n\nth {\n    padding: 12px 10px;\n    background: var(--surface);\n    color: var(--muted);\n    font-size: 9px;\n    letter-spacing: .7px;\n    text-transform: uppercase;\n}\n\ntd {\n    padding: 13px 10px;\n    border-bottom: 1px solid var(--line);\n    vertical-align: middle;\n}\n\n.empty-row {\n    padding: 20px 10px;\n    color: var(--muted);\n    line-height: 1.7;\n}\n\n/* STATUS */\n\n.status {\n    display: inline-block;\n    padding: 6px 9px;\n    border-radius: 20px;\n    background: var(--sage);\n    color: var(--green);\n    font-size: 9px;\n    white-space: nowrap;\n}\n\n.status.pending {\n    background: #f0f1ee;\n    color: #687168;\n}\n\n.status.warning {\n    background: #f5eee0;\n    color: #80632b;\n}\n\n/* INFORMATION BOXES */\n\n.notice {\n    padding: 15px;\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    background: var(--surface);\n    color: var(--muted);\n    font-size: 11px;\n    line-height: 1.8;\n}\n\n.info-grid {\n    display: grid;\n    grid-template-columns: repeat(3,1fr);\n    gap: 18px;\n}\n\n.info-box {\n    padding: 15px;\n    border: 1px solid var(--line);\n    border-radius: 6px;\n}\n\n.info-box strong {\n    display: block;\n    margin-bottom: 7px;\n    font-size: 12px;\n}\n\n.info-box span {\n    color: var(--muted);\n    font-size: 11px;\n    line-height: 1.6;\n}\n\n.page-footer {\n    padding: 20px 38px;\n    border-top: 1px solid var(--line);\n    background: white;\n    color: var(--muted);\n    font-size: 10px;\n}\n\n/* RESPONSIVE */\n\n@media(max-width:1050px) {\n    .details-grid { grid-template-columns: repeat(2,1fr); }\n    .stage-grid { grid-template-columns: repeat(2,1fr); }\n    .page-heading { flex-direction: column; }\n}\n\n@media(max-width:760px) {\n    .sidebar {\n        width: 72px;\n        min-width: 72px;\n    }\n\n    .sidebar-brand {\n        justify-content: center;\n        padding: 15px 5px;\n    }\n\n    .sidebar-brand img {\n        width: 48px;\n        height: 48px;\n    }\n\n    .sidebar-brand > div,\n    .menu-heading,\n    .menu-text {\n        display: none;\n    }\n\n    .sidebar-menu { padding: 12px 7px; }\n\n    .menu-item,\n    .logout-button {\n        justify-content: center;\n        padding: 13px 5px;\n        text-align: center;\n    }\n\n    .top-header { padding: 0 18px; }\n    .content { padding: 25px 18px; }\n\n    .two-column { grid-template-columns: 1fr; }\n    .info-grid { grid-template-columns: 1fr; }\n    .page-footer { padding: 17px 18px; }\n}\n\n@media(max-width:480px) {\n    .details-grid,\n    .stage-grid { grid-template-columns: 1fr; }\n\n    .header-user-name { display: none; }\n\n    .scheme-banner {\n        align-items: flex-start;\n        flex-direction: column;\n    }\n}\n\u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n\u003cdiv class=\"layout\">\n\n\u003c!-- SIDEBAR -->\n\n\u003caside class=\"sidebar\">\n\n    \u003cdiv class=\"sidebar-brand\">\n        \u003cimg src=\"assets/emblem.png\" alt=\"Gaia Conscious\">\n        \u003cdiv>\n            \u003cdiv class=\"brand-name\">GAIA CONSCIOUS\u003c/div>\n            \u003cdiv class=\"brand-subtitle\">CLIENT PORTAL\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"menu-heading\">Main Menu\u003c/div>\n\n    \u003cnav class=\"sidebar-menu\">\n\n        \u003ca class=\"menu-item\" href=\"dashboard.html\">\n            \u003cspan class=\"menu-icon\">⌂\u003c/span>\n            \u003cspan class=\"menu-text\">Dashboard\u003c/span>\n        \u003c/a>\n\n        \u003ca class=\"menu-item active\" href=\"application.html\">\n            \u003cspan class=\"menu-icon\">▤\u003c/span>\n            \u003cspan class=\"menu-text\">Application Overview\u003c/span>\n        \u003c/a>\n\n        \u003ca class=\"menu-item\" href=\"documents.html\">\n            \u003cspan class=\"menu-icon\">▧\u003c/span>\n            \u003cspan class=\"menu-text\">Documents\u003c/span>\n        \u003c/a>\n\n        \u003ca class=\"menu-item\" href=\"assessment.html\">\n            \u003cspan class=\"menu-icon\">✓\u003c/span>\n            \u003cspan class=\"menu-text\">Assessment\u003c/span>\n        \u003c/a>\n\n        \u003ca class=\"menu-item\" href=\"reports.html\">\n            \u003cspan class=\"menu-icon\">▥\u003c/span>\n            \u003cspan class=\"menu-text\">Reports\u003c/span>\n        \u003c/a>\n\n        \u003ca class=\"menu-item\" href=\"certification.html\">\n            \u003cspan class=\"menu-icon\">✧\u003c/span>\n            \u003cspan class=\"menu-text\">Certification\u003c/span>\n        \u003c/a>\n\n        \u003ca class=\"menu-item\" href=\"organisation.html\">\n            \u003cspan class=\"menu-icon\">▣\u003c/span>\n            \u003cspan class=\"menu-text\">Organisation\u003c/span>\n        \u003c/a>\n\n    \u003c/nav>\n\n    \u003cdiv class=\"menu-heading\">Account\u003c/div>\n\n    \u003cnav class=\"sidebar-menu\">\n        \u003ca class=\"menu-item\" href=\"organisation.html\">\n            \u003cspan class=\"menu-icon\">○\u003c/span>\n            \u003cspan class=\"menu-text\">Account Information\u003c/span>\n        \u003c/a>\n    \u003c/nav>\n\n    \u003cdiv class=\"sidebar-bottom\">\n        \u003cbutton class=\"logout-button\" id=\"logoutButton\">\n            \u003cspan class=\"menu-icon\">↪\u003c/span>\n            \u003cspan class=\"menu-text\">Log Out\u003c/span>\n        \u003c/button>\n    \u003c/div>\n\n\u003c/aside>\n\n\n\u003c!-- MAIN CONTENT -->\n\n\u003cmain class=\"main-area\">\n\n    \u003cheader class=\"top-header\">\n\n        \u003cdiv>\n            \u003cdiv class=\"header-title\">APPLICATION OVERVIEW\u003c/div>\n            \u003cdiv class=\"header-subtitle\">\n                Gaia Conscious Certification Portal\n            \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"header-right\">\n            \u003cspan class=\"header-user-name\" id=\"headerUserName\">\n                Client account\n            \u003c/span>\n            \u003cdiv class=\"user-initial\" id=\"userInitial\">G\u003c/div>\n        \u003c/div>\n\n    \u003c/header>\n\n\n    \u003csection class=\"content\">\n\n        \u003c!-- PAGE INTRODUCTION -->\n\n        \u003cdiv class=\"page-heading\">\n\n            \u003cdiv>\n                \u003cdiv class=\"eyebrow\">CLIENT PORTAL\u003c/div>\n                \u003ch1>Application Overview\u003c/h1>\n                \u003cp class=\"intro\">\n                    Follow your certification application, monitor its progress\n                    and view the actions required at each stage.\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"reference-card\">\n                \u003cspan class=\"reference-label\">Application Reference\u003c/span>\n                \u003cdiv class=\"reference-value\" id=\"applicationReference\">\n                    To be assigned\n                \u003c/div>\n            \u003c/div>\n\n        \u003c/div>\n\n\n        \u003c!-- APPLICATION DETAILS -->\n\n        \u003csection class=\"panel\">\n\n            \u003ch2>Application Information\u003c/h2>\n\n            \u003cp class=\"panel-description\">\n                Your registered application details.\n            \u003c/p>\n\n            \u003cdiv class=\"details-grid\">\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Client ID\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"clientID\">Loading...\u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Organisation\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"businessName\">Loading...\u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Contact Person\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"contactName\">Loading...\u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Application Date\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"applicationDate\">\n                        To be populated\n                    \u003c/div>\n                \u003c/div>\n\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- SELECTED SCHEME -->\n\n        \u003cdiv class=\"section-heading\">Selected Certification Scheme\u003c/div>\n\n        \u003cdiv class=\"scheme-banner\">\n\n            \u003cdiv>\n                \u003cdiv class=\"eyebrow\">CERTIFICATION SCHEME\u003c/div>\n                \u003cdiv class=\"scheme-name\" id=\"schemeName\">\n                    Scheme not selected\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"stage-label\" id=\"currentStage\">\n                CURRENT STAGE: PRE-ASSESSMENT\n            \u003c/div>\n\n        \u003c/div>\n\n\n        \u003c!-- CERTIFICATION JOURNEY -->\n\n        \u003cdiv class=\"section-heading\">Your Certification Journey\u003c/div>\n\n        \u003csection class=\"panel\">\n\n            \u003ch2>Application Progress\u003c/h2>\n\n            \u003cp class=\"panel-description\">\n                Your application moves through nine operational stages.\n                Each stage is updated as your application progresses.\n            \u003c/p>\n\n            \u003cdiv class=\"stage-grid\" id=\"stageGrid\">\n\n                \u003cdiv class=\"stage-card completed\">\n                    \u003cdiv class=\"stage-number\">1\u003c/div>\n                    \u003cdiv class=\"stage-name\">Enquiry & Proposal\u003c/div>\n                    \u003cdiv class=\"stage-status\">Completed\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card completed\">\n                    \u003cdiv class=\"stage-number\">2\u003c/div>\n                    \u003cdiv class=\"stage-name\">Application & Agreement\u003c/div>\n                    \u003cdiv class=\"stage-status\">Completed\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card current\">\n                    \u003cdiv class=\"stage-number\">3\u003c/div>\n                    \u003cdiv class=\"stage-name\">Pre-Assessment\u003c/div>\n                    \u003cdiv class=\"stage-status\">In Progress\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card\">\n                    \u003cdiv class=\"stage-number\">4\u003c/div>\n                    \u003cdiv class=\"stage-name\">Assessment\u003c/div>\n                    \u003cdiv class=\"stage-status\">Upcoming\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card\">\n                    \u003cdiv class=\"stage-number\">5\u003c/div>\n                    \u003cdiv class=\"stage-name\">Reporting\u003c/div>\n                    \u003cdiv class=\"stage-status\">Upcoming\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card\">\n                    \u003cdiv class=\"stage-number\">6\u003c/div>\n                    \u003cdiv class=\"stage-name\">Certification Decision\u003c/div>\n                    \u003cdiv class=\"stage-status\">Upcoming\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card\">\n                    \u003cdiv class=\"stage-number\">7\u003c/div>\n                    \u003cdiv class=\"stage-name\">Certificate Issuance\u003c/div>\n                    \u003cdiv class=\"stage-status\">Upcoming\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card\">\n                    \u003cdiv class=\"stage-number\">8\u003c/div>\n                    \u003cdiv class=\"stage-name\">Surveillance & Renewal\u003c/div>\n                    \u003cdiv class=\"stage-status\">Upcoming\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"stage-card\">\n                    \u003cdiv class=\"stage-number\">9\u003c/div>\n                    \u003cdiv class=\"stage-name\">Closed\u003c/div>\n                    \u003cdiv class=\"stage-status\">Upcoming\u003c/div>\n                \u003c/div>\n\n            \u003c/div>\n\n            \u003cdiv class=\"progress-track\">\n                \u003cdiv class=\"progress-fill\" id=\"progressFill\">\u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"progress-caption\">\n                \u003cspan id=\"progressLabel\">Application progress\u003c/span>\n                \u003cspan id=\"progressPercent\">—\u003c/span>\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- CURRENT APPLICATION ACTION -->\n\n        \u003cdiv class=\"section-heading\">Current Application Requirements\u003c/div>\n\n        \u003csection class=\"panel\">\n\n            \u003cdiv class=\"details-grid\">\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Current Stage\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"stageDetail\">\n                        Pre-Assessment\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Next Action\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"nextAction\">\n                        Awaiting document requirements\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Submission Deadline\u003c/span>\n                    \u003cdiv class=\"detail-value\" id=\"submissionDeadline\">\n                        To be assigned\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv>\n                    \u003cspan class=\"detail-label\">Application Status\u003c/span>\n                    \u003cdiv class=\"detail-value\">\n                        \u003cspan class=\"status pending\" id=\"applicationStatus\">\n                            In Progress\n                        \u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- DOCUMENT REQUIREMENTS -->\n\n        \u003cdiv class=\"section-heading\">Document Requirements\u003c/div>\n\n        \u003csection class=\"panel\">\n\n            \u003ch2>Document Submission Tracker\u003c/h2>\n\n            \u003cp class=\"panel-description\">\n                Documents requested for your selected certification scheme\n                will be displayed here. You can monitor the review status\n                of each submission.\n            \u003c/p>\n\n            \u003cdiv class=\"table-wrap\">\n\n                \u003ctable>\n\n                    \u003cthead>\n                        \u003ctr>\n                            \u003cth>Document\u003c/th>\n                            \u003cth>Date Requested\u003c/th>\n                            \u003cth>Deadline\u003c/th>\n                            \u003cth>Submission Status\u003c/th>\n                        \u003c/tr>\n                    \u003c/thead>\n\n                    \u003ctbody id=\"documentTable\">\n\n                        \u003ctr>\n                            \u003ctd colspan=\"4\" class=\"empty-row\">\n                                No document requests have been issued yet.\n                                Your document checklist will appear here\n                                once it has been assigned.\n                            \u003c/td>\n                        \u003c/tr>\n\n                    \u003c/tbody>\n\n                \u003c/table>\n\n            \u003c/div>\n\n            \u003cdiv class=\"notice\" style=\"margin-top:18px\">\n                \u003cstrong>Submission period:\u003c/strong> 14 days from the\n                document request date.\n\n                \u003cbr>\n\n                \u003cstrong>Reminders:\u003c/strong> Notifications are scheduled\n                for day 7 and day 12.\n\n                \u003cbr>\n\n                \u003cstrong>Document statuses:\u003c/strong>\n                Not Submitted, Submitted, Under Review, Accepted,\n                Changes Required and Resubmitted.\n            \u003c/div>\n\n        \u003c/section>\n\n\n        \u003c!-- PAYMENTS AND ASSESSMENT -->\n\n        \u003cdiv class=\"two-column\">\n\n            \u003csection class=\"panel\">\n\n                \u003ch2>Fees & Payments\u003c/h2>\n\n                \u003cp class=\"panel-description\">\n                    View your certification quotation and payment progress.\n                \u003c/p>\n\n                \u003cdiv class=\"info-grid\">\n\n                    \u003cdiv class=\"info-box\">\n                        \u003cstrong>Quotation\u003c/strong>\n                        \u003cspan id=\"quotationAmount\">Not yet issued\u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv class=\"info-box\">\n                        \u003cstrong>50% Deposit\u003c/strong>\n                        \u003cspan id=\"depositAmount\">Awaiting quotation\u003c/span>\n                    \u003c/div>\n\n                    \u003cdiv class=\"info-box\">\n                        \u003cstrong>Outstanding Balance\u003c/strong>\n                        \u003cspan id=\"balanceAmount\">Not yet calculated\u003c/span>\n                    \u003c/div>\n\n                \u003c/div>\n\n                \u003cdiv class=\"status-row\" style=\"margin-top:17px\">\n                    \u003cspan>Payment Status\u003c/span>\n                    \u003cspan class=\"status pending\" id=\"paymentStatus\">\n                        Awaiting quotation\n                    \u003c/span>\n                \u003c/div>\n\n            \u003c/section>\n\n\n            \u003csection class=\"panel\">\n\n                \u003ch2>Assessment\u003c/h2>\n\n                \u003cp class=\"panel-description\">\n                    Assessment scheduling and progress will be recorded here.\n                \u003c/p>\n\n                \u003cdiv class=\"status-row\">\n                    \u003cspan>Assessment Date\u003c/span>\n                    \u003cspan>Not scheduled\u003c/span>\n                \u003c/div>
